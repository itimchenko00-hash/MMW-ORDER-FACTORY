name: ENERGY PARK controlled media import

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05
    paths:
      - ".github/workflows/energy-park-media-import.yml"
      - "MMW-COMPANY/2 — WORKING/public/energy.html"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 1

      - name: Download controlled Pexels originals
        shell: bash
        run: |
          set -euo pipefail
          ROOT="MMW-COMPANY/2 — WORKING/public/ASSETS/ENERGY-PARK"
          DIR="$ROOT/photos/web-selected"
          rm -rf "$ROOT"
          rm -rf "ASSETS/ENERGY-PARK"
          mkdir -p "$DIR"
          TMP="$RUNNER_TEMP/energy-park-media"
          rm -rf "$TMP"
          mkdir -p "$TMP"/

          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/29923348/pexels-photo-29923348.jpeg?cs=srgb&dl=pexels-nova-lv-155338973-29923348.jpg&fm=jpg" -o "$TMP/01-hero-industrial-solar.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/29512491/pexels-photo-29512491.jpeg?cs=srgb&dl=pexels-altaf-shah-3143825-29512491.jpg&fm=jpg" -o "$TMP/02-industrial-rooftops.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/35454189/pexels-photo-35454189.jpeg?cs=srgb&dl=pexels-china-yu-200611083-35454189.jpg&fm=jpg" -o "$TMP/03-industrial-solar-detail.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/14673396/pexels-photo-14673396.jpeg?cs=srgb&dl=pexels-jamshaid-anwar-345256184-14673396.jpg&fm=jpg" -o "$TMP/04-rooftop-solar.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/35454187/pexels-photo-35454187.jpeg?cs=srgb&dl=pexels-china-yu-200611083-35454187.jpg&fm=jpg" -o "$TMP/05-industrial-solar-storage.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/36085816/pexels-photo-36085816.jpeg?cs=srgb&dl=pexels-elite-power-group-661996115-36085816.jpg&fm=jpg" -o "$TMP/04-energy-storage.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/38217230/pexels-photo-38217230.jpeg?cs=srgb&dl=pexels-vjanodic-38217230.jpg&fm=jpg" -o "$TMP/05-control-room.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/39174676/pexels-photo-39174676.jpeg?cs=srgb&dl=pexels-vyvan-bui-vy-van-1139609066-39174676.jpg&fm=jpg" -o "$TMP/06-engineering-operator.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/11924298/pexels-photo-11924298.jpeg?cs=srgb&dl=pexels-connorscottmcmanus-11924298.jpg&fm=jpg" -o "$TMP/07-energy-metering.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/18468536/pexels-photo-18468536.jpeg?cs=srgb&dl=pexels-robertkso-18468536.jpg&fm=jpg" -o "$TMP/08-industrial-grid.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/17641131/pexels-photo-17641131.jpeg?cs=srgb&dl=pexels-jonathanyue-17641131.jpg&fm=jpg" -o "$TMP/09-energy-base.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/35454191/pexels-photo-35454191.jpeg?cs=srgb&dl=pexels-china-yu-200611083-35454191.jpg&fm=jpg" -o "$TMP/10-energy-hub.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/29923355/pexels-photo-29923355.jpeg?cs=srgb&dl=pexels-nova-lv-155338973-29923355.jpg&fm=jpg" -o "$TMP/11-energy-cluster.jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media importer" "https://images.pexels.com/photos/34526423/pexels-photo-34526423.jpeg?cs=srgb&dl=pexels-mickael-ange-konan-34526423.jpg&fm=jpg" -o "$TMP/12-energy-service.jpg"

          for f in "$TMP"/*.jpg; do
            test -s "$f"
            file "$f" | grep -Eiq "JPEG image data|JFIF"
          done
          cd "$TMP"
          zip -q "$RUNNER_TEMP/energy-park-media.zip" ./*.jpg
          cd "$GITHUB_WORKSPACE"
          rm -rf "$DIR"
          mkdir -p "$DIR"
          ZIP_PATH="$RUNNER_TEMP/energy-park-media.zip" DEST_DIR="$DIR" python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          z=Path(os.environ["ZIP_PATH"])
          d=Path(os.environ["DEST_DIR"])
          with ZipFile(z) as archive:
              archive.extractall(d)
          files=sorted(d.glob("*.jpg"))
          print("UNPACKED:", [x.name for x in files])
          assert len(files) == 14
          assert all(x.stat().st_size > 0 for x in files)
          PY
          echo "ZIP created and unpacked: $RUNNER_TEMP/energy-park-media.zip"
          find "$DIR" -maxdepth 1 -type f -name '*.jpg' -print

      - name: Rebind page to local assets only
        shell: python
        run: |
          from pathlib import Path
          p = Path("MMW-COMPANY/2 — WORKING/public/energy.html")
          s = p.read_text(encoding="utf-8")

          repl = {
            "00-hero-energy-park.jpg": "01-hero-industrial-solar.jpg",
            "01-industrial-energy-site.jpg": "02-industrial-rooftops.jpg",
            "09-industrial-rooftops.jpg": "03-industrial-solar-detail.jpg",
            "02-grid-substation.jpg": "04-rooftop-solar.jpg",
            "03-industrial-solar.jpg": "05-industrial-solar-storage.jpg",
          }
          for a,b in repl.items():
            s = s.replace(a,b)

          p.write_text(s, encoding="utf-8")

      - name: Write provenance and checksums
        shell: bash
        run: |
          DIR="MMW-COMPANY/2 — WORKING/public/ASSETS/ENERGY-PARK/photos/web-selected"
          {
            echo "# ENERGY PARK — controlled media import"
            echo
            echo "Imported from Pexels; runtime uses local project assets only."
            echo
            echo "| Local asset | Semantic use | Source |"
            echo "|---|---|---|"
            echo "| 01-hero-industrial-solar.jpg | Hero / industrial energy context | https://www.pexels.com/photo/aerial-view-of-solar-panels-on-industrial-building-29923348/ |"
            echo "| 02-industrial-rooftops.jpg | Resource / industrial rooftop generation | https://www.pexels.com/photo/aerial-view-of-solar-panels-on-industrial-rooftops-29512491/ |"
            echo "| 03-industrial-solar-detail.jpg | Load / visible industrial generation scale | https://www.pexels.com/photo/aerial-view-of-solar-panels-on-industrial-roof-35454189/ |"
            echo "| 04-rooftop-solar.jpg | System / renewable energy infrastructure | https://www.pexels.com/photo/solar-panels-on-the-roof-14673396/ |"
            echo "| 05-industrial-solar-storage.jpg | Value / industrial solar + storage context | https://www.pexels.com/photo/industrial-facility-with-solar-panel-rooftop-35454187/ |"
            echo "| 04-energy-storage.jpg | Energy flow / storage component | https://www.pexels.com/photo/electrician-working-on-solar-battery-installation-36085816/ |"
            echo "| 05-control-room.jpg | Energy flow / control and dispatch | https://www.pexels.com/photo/female-technician-working-on-electrical-control-panel-34526423/ |"
            echo "| 06-engineering-operator.jpg | Energy flow / engineering service | https://www.pexels.com/photo/engineer-inspecting-electrical-control-panel-39174676/ |"
            echo "| 07-energy-metering.jpg | Energy flow / metering and measurement | https://www.pexels.com/photo/row-of-electricity-meters-11924298/ |"
            echo "| 08-industrial-grid.jpg | Energy flow / grid infrastructure | https://www.pexels.com/photo/power-distribution-substation-18468536/ |"
            echo "| 09-energy-base.jpg | ENERGY BASE / one production or commercial consumer | https://www.pexels.com/photo/warehouse-in-countryside-under-blue-sky-17641131/ |"
            echo "| 10-energy-hub.jpg | ENERGY HUB / shared system for several consumers | https://www.pexels.com/photo/aerial-view-of-industrial-complex-in-china-35454191/ |"
            echo "| 11-energy-cluster.jpg | ENERGY CLUSTER / integrated production environment | https://www.pexels.com/photo/aerial-view-of-solar-panel-covered-industrial-buildings-29923355/ |"
            echo "| 12-energy-service.jpg | ENERGY SERVICE / managed energy infrastructure and operations | https://www.pexels.com/photo/female-technician-working-on-electrical-control-panel-34526423/ |"
            echo
            echo "## SHA-256"
            find "$DIR" -type f -name "*.jpg" -print0 | sort -z | xargs -0 sha256sum
          } > "MMW-COMPANY/2 — WORKING/public/ASSETS/ENERGY-PARK/SOURCES.md"

      - name: Commit only the controlled import
        shell: bash
        run: |
          git config user.name "MMW-COMPANY controlled importer"
          git config user.email "itimchenko00@gmail.com"
          git add -A "MMW-COMPANY/2 — WORKING/public/energy.html"
          find "MMW-COMPANY/2 — WORKING/public/ASSETS/ENERGY-PARK" -type f -maxdepth 3 -print
          git add -f "MMW-COMPANY/2 — WORKING/public/ASSETS/ENERGY-PARK/photos/web-selected/"*.jpg
          git add -f "MMW-COMPANY/2 — WORKING/public/ASSETS/ENERGY-PARK/SOURCES.md"
          git status --short
          if git diff --cached --quiet; then
            echo "No media changes."
            exit 0
          fi
          git commit -m "ENERGY PARK: controlled local media import"
          git fetch origin MMW-COMPANY-WORKSPACE-V1-2026-10-05
          git rebase origin/MMW-COMPANY-WORKSPACE-V1-2026-10-05
          git push origin HEAD:MMW-COMPANY-WORKSPACE-V1-2026-10-05
