name: AGROHUB controlled media import

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05
    paths:
      - "MMW-COMPANY/2 — WORKING/public/agrohub.html"
      - "MMW-COMPANY/2 — WORKING/public/ASSETS/AGROHUB/**"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 1

      - name: Download verified Wikimedia Commons originals
        shell: bash
        run: |
          set -euo pipefail
          dir="MMW-COMPANY/2 — WORKING/public/ASSETS/AGROHUB/photos/web-selected"
          mkdir -p "$dir"
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Field_of_wheat.jpg" -o "$dir/01-source-field.jpg"
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Harvested_grain_being_loaded_onto_transport_-_geograph.org.uk_-_3635572.jpg" -o "$dir/02-collection-transport.jpg"
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Farm_storage.jpg" -o "$dir/03-storage.jpg"
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Rice_Processing_Plant.jpg" -o "$dir/04-processing.jpg"
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Grains_market_at_Dan_Daura_village,_Kaduna_State_01.jpg" -o "$dir/05-market.jpg"
          curl -fL --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Grain_silos.jpg" -o "$dir/06-territory-silos.jpg"
          file "$dir"/*.jpg
          for f in "$dir"/*.jpg; do
            file "$f" | grep -Eiq 'JPEG image data' || { echo "Not JPEG: $f"; exit 1; }
            test -s "$f" || { echo "Empty file: $f"; exit 1; }
          done

      - name: Rebuild semantic media placement
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("MMW-COMPANY/2 — WORKING/public/agrohub.html")
          s=p.read_text(encoding="utf-8")
          # Make the media layer idempotent: remove only previously injected AGROHUB media elements.
          s=re.sub(r'<section class="section"><div class="wrap"><figure class="agroPhoto">.*?</figure></div></section>\\n?', '', s, flags=re.S)
          s=re.sub(r'<div class="agroModal" id="agroPhotoModal".*?</div></div></div>', '', s, flags=re.S)
          s=re.sub(r'\\.agroPhoto\\{.*?\\.choice \\{overflow:hidden\\}\\.choice \\.photoHint\\{.*?\\}', '', s)
          marker='<section class="section" id="chain">'
          hero='''<section class="section"><div class="wrap"><figure class="agroPhoto"><img src="/ASSETS/AGROHUB/photos/web-selected/01-source-field.jpg" alt="AGROHUB — сырьевая база и поле" loading="eager" decoding="async"><figcaption>Сырьевая база · источник потока AGROHUB</figcaption></figure></div></section>'''
          s=s.replace(marker, hero+'\\n'+marker, 1)
          s=s.replace('<button class="choice active" onclick="pick(this)"><span class="num">01</span><h3>СБОР</h3>',
                      '<button class="choice active" data-photo="/ASSETS/AGROHUB/photos/web-selected/02-collection-transport.jpg" data-caption="Сбор · поступление урожая и формирование управляемого входящего потока" onclick="pick(this)"><span class="num">01</span><h3>СБОР</h3>')
          s=s.replace('<button class="choice" onclick="pick(this)"><span class="num">02</span><h3>ХРАНЕНИЕ</h3>',
                      '<button class="choice" data-photo="/ASSETS/AGROHUB/photos/web-selected/03-storage.jpg" data-caption="Хранение · запас, который нужно сохранить без потери качества" onclick="pick(this)"><span class="num">02</span><h3>ХРАНЕНИЕ</h3>')
          s=s.replace('<button class="choice" onclick="pick(this)"><span class="num">03</span><h3>ОБРАБОТКА</h3>',
                      '<button class="choice" data-photo="/ASSETS/AGROHUB/photos/web-selected/04-processing.jpg" data-caption="Обработка · переход от сырья к переработанному продукту" onclick="pick(this)"><span class="num">03</span><h3>ОБРАБОТКА</h3>')
          s=s.replace('<button class="choice" onclick="pick(this)"><span class="num">04</span><h3>РЫНОК</h3>',
                      '<button class="choice" data-photo="/ASSETS/AGROHUB/photos/web-selected/05-market.jpg" data-caption="Рынок · реальная точка спроса и товарного обмена" onclick="pick(this)"><span class="num">04</span><h3>РЫНОК</h3>')
          territory='<section class="section"><div class="wrap"><figure class="agroPhoto"><img src="/ASSETS/AGROHUB/photos/web-selected/06-territory-silos.jpg" alt="AGROHUB — инфраструктура хранения и территории" loading="lazy" decoding="async"><figcaption>Инфраструктура · территория, хранение и логистическая связка</figcaption></figure></div></section>'
          s=s.replace('<section class="section dark" id="pilot">', territory+'\\n<section class="section dark" id="pilot">', 1)
          pilot='<section class="section"><div class="wrap"><figure class="agroPhoto"><img src="/ASSETS/AGROHUB/photos/web-selected/02-collection-transport.jpg" alt="AGROHUB — движение аграрного потока" loading="lazy" decoding="async"><figcaption>Поток · движение продукта между операциями и рынком</figcaption></figure></div></section>'
          # Keep the pilot visual distinct: use the processing-center aerial image instead of reusing collection.
          pilot=pilot.replace("02-collection-transport.jpg","04-processing.jpg").replace("движение аграрного потока","операционный контур переработки").replace("движение продукта между операциями и рынком","связка сбора, обработки и отгрузки")
          s=s.replace('<section class="section"><div class="wrap"><div class="sectionHead"><div><span class="pill">06 · Риски</span>', pilot+'\\n<section class="section"><div class="wrap"><div class="sectionHead"><div><span class="pill">06 · Риски</span>', 1)
          css='''.agroPhoto{margin:34px 0 0;border-radius:28px;overflow:hidden;background:#20382a;box-shadow:0 24px 70px #17201920}.agroPhoto img{display:block;width:100%;height:clamp(230px,34vw,430px);object-fit:cover}.agroPhoto figcaption{padding:12px 16px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#687268;background:#fff}.dark .agroPhoto figcaption{background:#17241b;color:#aeb9ad}.agroModal{position:fixed;inset:0;z-index:100;background:#111812dd;display:none;align-items:center;justify-content:center;padding:22px}.agroModal.open{display:flex}.agroModalCard{width:min(980px,96vw);max-height:92vh;background:var(--paper);border-radius:28px;overflow:hidden;box-shadow:0 35px 100px #0008;position:relative}.agroModalCard img{display:block;width:100%;max-height:72vh;object-fit:cover}.agroModalInfo{padding:16px 20px}.agroModalInfo b{display:block;font-size:10px;color:var(--field);letter-spacing:.1em;text-transform:uppercase}.agroModalInfo span{display:block;margin-top:6px;font-size:12px;color:var(--mut)}.agroModalClose{position:absolute;right:14px;top:14px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:var(--ink);font-weight:950;cursor:pointer;font-size:18px}.choice{overflow:hidden}.choice .photoHint{display:block;margin-top:12px;font-size:9px;color:var(--field);font-weight:900;letter-spacing:.05em}'''
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace('</div></main><footer', '''</div><div class="agroModal" id="agroPhotoModal" role="dialog" aria-modal="true" aria-label="Фотография AGROHUB" onclick="closeAgroPhoto(event)"><div class="agroModalCard"><button class="agroModalClose" type="button" aria-label="Закрыть" onclick="closeAgroPhoto()">×</button><img id="agroModalImg" src="" alt=""><div class="agroModalInfo"><b>AGROHUB</b><span id="agroModalCaption"></span></div></div></div></main><footer''',1)
          s=s.replace('function pick(e){document.querySelectorAll(\'#chain .choice\').forEach(x=>x.classList.remove(\'active\'));e.classList.add(\'active\')}',
                      '''function pick(e){document.querySelectorAll('#chain .choice').forEach(x=>x.classList.remove('active'));e.classList.add('active');if(e.dataset.photo)openAgroPhoto(e.dataset.photo,e.dataset.caption)}\\nfunction openAgroPhoto(src,caption){agroModalImg.src=src;agroModalImg.alt=caption||'AGROHUB';agroModalCaption.textContent=caption||'';agroPhotoModal.classList.add('open');document.body.style.overflow='hidden'}\\nfunction closeAgroPhoto(e){if(e && e.target!==agroPhotoModal)return;agroPhotoModal.classList.remove('open');agroModalImg.src='';document.body.style.overflow=''}\\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')closeAgroPhoto()})''')
          p.write_text(s,encoding="utf-8")

      - name: Record provenance and verify no external runtime images
        shell: bash
        run: |
          set -euo pipefail
          base="MMW-COMPANY/2 — WORKING/public/ASSETS/AGROHUB"
          cat > "$base/SOURCES.md" <<'EOF'
          # AGROHUB — media provenance

          Active media follows: WEB SOURCE → CONTROLLED IMPORT → LOCAL FACTORY ASSET → SEMANTIC PLACEMENT → PROVENANCE → QA → LIVE.

          01-source-field.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Field_of_wheat.jpg
          - Author: Depressedlymotivated
          - License: CC BY 4.0
          - Meaning: сырьевая база / поле / исходный поток.

          02-collection-transport.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Harvested_grain_being_loaded_onto_transport_-_geograph.org.uk_-_3635572.jpg
          - Author: Bill Boaden
          - License: CC BY-SA 2.0
          - Meaning: сбор / поступление урожая / входящий поток.

          03-storage.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Farm_storage.jpg
          - Author: Photobyamin
          - License: CC BY-SA 4.0
          - Meaning: хранение / сохранение качества и запаса.

          04-processing.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Rice_Processing_Plant.jpg
          - Author: Dixon099
          - License: CC BY-SA 4.0
          - Meaning: обработка / производственный контур / создание добавленной стоимости.

          05-market.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Grains_market_at_Dan_Daura_village,_Kaduna_State_01.jpg
          - Author: Friday musa
          - License: CC BY-SA 4.0
          - Meaning: рынок / товарный обмен / точка спроса.

          06-territory-silos.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Grain_silos.jpg
          - Author: Johnscotaus
          - License: CC BY 4.0
          - Meaning: территория / хранение / инфраструктурная связка.

          Policy: no generated, synthetic, placeholder, external-runtime, proxy or remotely transformed images are activated. All active images are local JPEG binaries with provenance.
          EOF
          grep -Eo 'src="https?://[^"]+"' "MMW-COMPANY/2 — WORKING/public/agrohub.html" && exit 1 || true
          grep -Eo 'src="/ASSETS/AGROHUB/photos/web-selected/[^"]+"' "MMW-COMPANY/2 — WORKING/public/agrohub.html" | sort -u
          test "$(find "$base/photos/web-selected" -type f -name '*.jpg' | wc -l)" -eq 6

      - name: Commit imported media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MMW Media Import"
          git config user.email "itimchenko00@gmail.com"
          git add "MMW-COMPANY/2 — WORKING/public/agrohub.html" "MMW-COMPANY/2 — WORKING/public/ASSETS/AGROHUB"
          git commit -m "AGROHUB: controlled local media rebuild with semantic photography"
          git push origin HEAD:MMW-COMPANY-WORKSPACE-V1-2026-10-05
