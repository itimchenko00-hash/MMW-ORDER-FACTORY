name: Controlled CARPATHIA media repair

on:
  push:
    paths:
      - ".github/workflows/carpathia-media-finalize.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 1

      - name: Import only verified replacement binaries
        shell: bash
        run: |
          set -euo pipefail
          base="public/ASSETS/CARPATHIA/photos/web-selected"
          mkdir -p "$base"

          get() {
            local id="$1"
            local name="$2"
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 90               --output "$base/$name"               "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=2400"
            test -s "$base/$name"
            test "$(xxd -l 2 -p "$base/$name")" = "ffd8"
          }

          get 27221305 "04-food.jpg"
          get 36818214 "07-service.jpg"
          get 35117010 "season-winter.jpg"
          get 37167189 "season-spring.jpg"
          get 19539027 "season-autumn.jpg"

      - name: Validate every CARPATHIA image
        shell: bash
        run: |
          set -euo pipefail
          base="public/ASSETS/CARPATHIA/photos/web-selected"
          expected=(
            01-hero.jpg 02-stay.jpg 03-nature.jpg 04-food.jpg
            05-experience.jpg 06-guest.jpg 07-service.jpg 08-model.jpg
            season-winter.jpg season-spring.jpg season-summer.jpg season-autumn.jpg
          )
          for f in "${expected[@]}"; do
            test -s "$base/$f"
            test "$(xxd -l 2 -p "$base/$f")" = "ffd8"
          done
          test "$(find "$base" -maxdepth 1 -type f -name '*.jpg' -size +1c | wc -l)" -eq 12

      - name: Remove temporary workflow and record provenance
        shell: bash
        run: |
          set -euo pipefail
          base="public/ASSETS/CARPATHIA/photos/web-selected"
          cat > "$base/SOURCES.md" <<'EOF'
# CARPATHIA ECO LODGE — controlled web media sources

Imported 2026-10-07 from verified Pexels web sources selected for the semantic meaning of the CARPATHIA blocks. Runtime uses only local copies under this directory. Source URLs are provenance records only.

| Local file | Semantic placement | Source |
|---|---|---|
| 01-hero.jpg | Hero / Carpathian retreat atmosphere | https://www.pexels.com/photo/rustic-mountain-cabin-nestled-in-alpine-forest-32059124/ |
| 02-stay.jpg | STAY / cabin accommodation | https://www.pexels.com/photo/a-view-of-the-mountains-from-a-window-27582055/ |
| 03-nature.jpg | NATURE / quiet mountain lake | https://www.pexels.com/photo/misty-morning-at-a-tranquil-lakeside-dock-31797840/ |
| 04-food.jpg | FOOD / local-style breakfast and gastronomy | https://www.pexels.com/photo/a-plate-with-eggs-bread-vegetables-and-other-items-27221305/ |
| 05-experience.jpg | EXPERIENCE / mountain activity | https://www.pexels.com/photo/scenic-mountain-hike-with-two-hikers-in-summer-35801449/ |
| 06-guest.jpg | GUEST / family mountain experience | https://www.pexels.com/photo/unrecognizable-father-with-son-contemplating-mountains-with-trees-7431138/ |
| 07-service.jpg | SERVICE / wellness / sauna | https://www.pexels.com/photo/modern-wooden-sauna-cabin-with-electric-heater-36818214/ |
| 08-model.jpg | MODEL / territory, landscape and site context | https://www.pexels.com/photo/forest-on-hills-8321633/ |
| season-winter.jpg | WINTER / snow cabin retreat | https://www.pexels.com/photo/snow-covered-cabin-in-winter-forest-landscape-35117010/ |
| season-spring.jpg | SPRING / mountain landscape in spring | https://www.pexels.com/photo/scenic-mountain-lake-in-spring-landscape-37167189/ |
| season-summer.jpg | SUMMER / mountain hiking | https://www.pexels.com/photo/hiker-enjoying-mountain-view-in-summer-forest-34486037/ |
| season-autumn.jpg | AUTUMN / mountain forest in autumn | https://www.pexels.com/photo/mountain-forest-in-autumn-19539027/ |

All selected Pexels pages are marked free to use. No external image URL is used by runtime.
EOF
          rm -f .github/workflows/carpathia-media-finalize.yml
          git config user.name "MMW-COMPANY media importer"
          git config user.email "itimchenko00@gmail.com"
          git add public/ASSETS/CARPATHIA/photos/web-selected .github/workflows/carpathia-media-finalize.yml
          git commit -m "MEDIA: finalize verified CARPATHIA local web assets"
          git push origin MMW-COMPANY-WORKSPACE-V1-2026-10-05
