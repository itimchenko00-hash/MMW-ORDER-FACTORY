name: AGROHUB journey media import
on:
  push:
    paths:
      - ".github/workflows/agrohub-journey-media.yml"
      - "public/ASSETS/AGROHUB/journey-trigger.txt"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download media
        run: |
          set -e
          mkdir -p public/ASSETS/AGROHUB/journey
          curl -L --fail -o public/ASSETS/AGROHUB/journey/01-raw-material.jpg "https://images.pexels.com/photos/37325420/pexels-photo-37325420.jpeg?auto=compress&cs=tinysrgb&w=1600"
          curl -L --fail -o public/ASSETS/AGROHUB/journey/02-production.jpg "https://images.pexels.com/photos/11679685/pexels-photo-11679685.jpeg?auto=compress&cs=tinysrgb&w=1600"
          curl -L --fail -o public/ASSETS/AGROHUB/journey/03-product.jpg "https://images.pexels.com/photos/32834451/pexels-photo-32834451.jpeg?auto=compress&cs=tinysrgb&w=1600"
          curl -L --fail -o public/ASSETS/AGROHUB/journey/04-market.jpg "https://images.pexels.com/photos/30893233/pexels-photo-30893233.jpeg?auto=compress&cs=tinysrgb&w=1600"
          curl -L --fail -o public/ASSETS/AGROHUB/journey/05-operation.jpg "https://images.pexels.com/photos/39839900/pexels-photo-39839900.jpeg?auto=compress&cs=tinysrgb&w=1600"
          curl -L --fail -o public/ASSETS/AGROHUB/journey/06-economics.jpg "https://images.pexels.com/photos/5156696/pexels-photo-5156696.jpeg?auto=compress&cs=tinysrgb&w=1600"
          curl -L --fail -o public/ASSETS/AGROHUB/journey/07-risks.jpg "https://images.pexels.com/photos/10546255/pexels-photo-10546255.jpeg?auto=compress&cs=tinysrgb&w=1600"
          curl -L --fail -o public/ASSETS/AGROHUB/journey/08-next-step.jpg "https://images.pexels.com/photos/5563384/pexels-photo-5563384.jpeg?auto=compress&cs=tinysrgb&w=1600"
          rm -f public/ASSETS/AGROHUB/journey-trigger.txt
          git config user.name "MMW-COMPANY"
          git config user.email "itimchenko00@gmail.com"
          git add public/ASSETS/AGROHUB/journey
          git commit -m "AGROHUB: import journey media"
          git push
