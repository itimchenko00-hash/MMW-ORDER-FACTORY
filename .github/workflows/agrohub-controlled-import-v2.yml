name: AGROHUB controlled media import v2
on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05
    paths:
      - ".github/workflows/agrohub-controlled-import.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 1
      - name: Download and validate selected media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ASSETS/AGROHUB/photos
          base="https://commons.wikimedia.org/wiki/Special:FilePath/"
          curl -L --fail --retry 3 --retry-delay 2 "$base/Wheat_Field_in_Walla_Walla%2C_Washington%2C_2018.jpg?width=2400" -o ASSETS/AGROHUB/photos/01-field-source.jpg
          curl -L --fail --retry 3 --retry-delay 2 "$base/Soybeans_being_harvested.jpg?width=2400" -o ASSETS/AGROHUB/photos/02-grain-receiving.jpg
          curl -L --fail --retry 3 --retry-delay 2 "$base/Grain_silos_at_KSK_terminal.jpg?width=2400" -o ASSETS/AGROHUB/photos/03-storage-silos.jpg
          curl -L --fail --retry 3 --retry-delay 2 "$base/Conveyor_belt_moves_material_in_a_factory.jpg?width=2400" -o ASSETS/AGROHUB/photos/04-processing-line.jpg
          curl -L --fail --retry 3 --retry-delay 2 "$base/Agricultural_Warehouse.jpg?width=2400" -o ASSETS/AGROHUB/photos/05-agricultural-warehouse.jpg
          curl -L --fail --retry 3 --retry-delay 2 "$base/Container_loading_with_forklift_at_warehouse_in_Thailand.jpg?width=2400" -o ASSETS/AGROHUB/photos/06-logistics-loading.jpg
          for f in ASSETS/AGROHUB/photos/*.jpg; do
            test -s "$f"
            file "$f" | grep -Eqi 'JPEG image data|JFIF'
          done
      - name: Write provenance
        shell: bash
        run: |
          cat > ASSETS/AGROHUB/SOURCES.md <<'EOF'
          # AGROHUB — media provenance

          All runtime images are stored locally in this project under ASSETS/AGROHUB/photos/.
          No external image URL is used by the page at runtime.

          ## 01-field-source.jpg
          - Source: Wikimedia Commons — “Wheat Field in Walla Walla, Washington, 2018”
          - Author: Jason W Lacey
          - License: CC0 1.0
          - Source page: https://commons.wikimedia.org/wiki/File:Wheat_Field_in_Walla_Walla,_Washington,_2018.jpg
          - Semantic role: hero / сырьевая база

          ## 02-grain-receiving.jpg
          - Source: Wikimedia Commons — “Soybeans being harvested”
          - Author: Stephieaw
          - License: CC BY-SA 4.0
          - Source page: https://commons.wikimedia.org/wiki/File:Soybeans_being_harvested.jpg
          - Semantic role: приемка / входящий поток

          ## 03-storage-silos.jpg
          - Source: Wikimedia Commons — “Grain silos at KSK terminal”
          - Author: IvanStudenov
          - License: CC BY-SA 4.0
          - Source page: https://commons.wikimedia.org/wiki/File:Grain_silos_at_KSK_terminal.jpg
          - Semantic role: территория / хранение

          ## 04-processing-line.jpg
          - Source: Wikimedia Commons — “Conveyor belt moves material in a factory”
          - Author: Nenad Stojkovic
          - License: CC BY 2.0
          - Source page: https://commons.wikimedia.org/wiki/File:Conveyor_belt_moves_material_in_a_factory.jpg
          - Semantic role: переработка / добавленная стоимость

          ## 05-agricultural-warehouse.jpg
          - Source: Wikimedia Commons — “Agricultural Warehouse”
          - Author: photobankmd
          - License: CC0 1.0
          - Source page: https://commons.wikimedia.org/wiki/File:Agricultural_Warehouse.jpg
          - Semantic role: инфраструктура / хранение и оборот

          ## 06-logistics-loading.jpg
          - Source: Wikimedia Commons — “Container loading with forklift at warehouse in Thailand”
          - Author: Goterrestrial
          - License: CC BY 4.0
          - Source page: https://commons.wikimedia.org/wiki/File:Container_loading_with_forklift_at_warehouse_in_Thailand.jpg
          - Semantic role: отгрузка / логистика

          Imported through controlled project-local workflow. Images are validated as local JPEG binaries before commit.
          EOF
      - name: Commit local media and remove temporary importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agrohub-controlled-import.yml .github/workflows/agrohub-controlled-import-v2.yml
          git config user.name "MMW Factory"
          git config user.email "itimchenko00@gmail.com"
          git add ASSETS/AGROHUB/photos ASSETS/AGROHUB/SOURCES.md .github/workflows/agrohub-controlled-import.yml
          git commit -m "AGROHUB: import controlled local media and provenance"
          git push origin HEAD:MMW-COMPANY-WORKSPACE-V1-2026-10-05
