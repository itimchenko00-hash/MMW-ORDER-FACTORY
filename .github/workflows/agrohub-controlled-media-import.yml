name: AGROHUB controlled media import

on:
  push:
    paths:
      - ".github/workflows/agrohub-controlled-import.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 0
      - name: Import approved local media
        shell: bash
        run: |
          set -euo pipefail
          dir="public/ASSETS/AGROHUB/photos/web-selected"
          mkdir -p "$dir"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media import" -o "$tmp/01-agrohub-facility.jpg" "https://images.pexels.com/photos/33678221/pexels-photo-33678221.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-33678221.jpg&fm=jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media import" -o "$tmp/02-grain-storage.jpg" "https://images.pexels.com/photos/2451421/pexels-photo-2451421.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-2451421.jpg&fm=jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media import" -o "$tmp/03-raw-material-intake.jpg" "https://images.pexels.com/photos/2965707/pexels-photo-2965707.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-2965707.jpg&fm=jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media import" -o "$tmp/04-processing-line.jpg" "https://images.pexels.com/photos/2889193/pexels-photo-2889193.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-2889193.jpg&fm=jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media import" -o "$tmp/05-sorting-line.jpg" "https://images.pexels.com/photos/32578355/pexels-photo-32578355.jpeg?cs=srgb&dl=pexels-jonathan-david-1312107-32578355.jpg&fm=jpg"
          curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media import" -o "$tmp/06-finished-product-logistics.jpg" "https://images.pexels.com/photos/11678431/pexels-photo-11678431.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-11678431.jpg&fm=jpg"
          for f in "$tmp"/*.jpg; do
            test "$(stat -c%s "$f")" -ge 20000
            file "$f" | grep -Eiq 'JPEG|PNG|Web/P'
          done
          find "$dir" -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -delete
          cp "$tmp"/* "$dir"/
      - name: Write provenance
        shell: bash
        run: |
          cat > public/ASSETS/AGROHUB/photos/web-selected/SOURCES.md <<'EOF'
# AGROHUB — controlled web media import

Import method: WEB SOURCE → CONTROLLED IMPORT → LOCAL FACTORY ASSET → SEMANTIC PLACEMENT → PROVENANCE → QA → LIVE

All runtime references are local. Source photos are from Pexels and are used under the Pexels License.

| Asset | Meaning | Source |
|---|---|---|
| 01-agrohub-facility.jpg | Hero / overall agro-infrastructure | https://www.pexels.com/photo/aerial-view-of-agricultural-facility-with-grain-silos-33678221/ |
| 02-grain-storage.jpg | Storage / grain handling | https://www.pexels.com/photo/modern-farm-complex-storing-of-grains-2451421/ |
| 03-raw-material-intake.jpg | Raw-material intake / receiving | https://www.pexels.com/photo/a-truck-dumping-grains-for-storing-2965707/ |
| 04-processing-line.jpg | Processing / technological line | https://www.pexels.com/photo/processing-of-sweet-potatoes-in-a-factory-2889193/ |
| 05-sorting-line.jpg | Sorting / quality / production workflow | https://www.pexels.com/photo/efficient-fruit-processing-on-conveyor-belts-32578355/ |
| 06-finished-product-logistics.jpg | Finished product / warehouse / dispatch | https://www.pexels.com/photo/stacks-of-brown-boxes-near-forklift-11678431/ |

## Runtime rule

The source URLs above are provenance only. The website references only local /ASSETS/AGROHUB/photos/web-selected/ files.
EOF
      - name: Commit imported assets
        shell: bash
        run: |
          git config user.name "MMW-COMPANY Factory"
          git config user.email "itimchenko00@gmail.com"
          git add public/ASSETS/AGROHUB/photos/web-selected
          git commit -m "AGROHUB: import approved local project media"
          git push origin MMW-COMPANY-WORKSPACE-V1-2026-10-05
