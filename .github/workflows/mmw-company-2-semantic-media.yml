name: MMW-COMPANY/2 semantic project media
on:
  push:
    branches: [MMW-COMPANY-WORKSPACE-V1-2026-10-05]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node mmw-company-2-media-import.js
      - name: Verify
        run: |
          for d in NEXUS-WORK CARPATHIA-ECO-LODGE AGROHUB ENERGY-PARK; do
            test "$(find "MMW-COMPANY/2 — WORKING/public/ASSETS/$d/photos" -type f -name '*.jpg' | wc -l)" -ge 6
          done
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "MMW-COMPANY/2 — WORKING/public/ASSETS" "MMW-COMPANY/2 — WORKING/public/media-layer.js" "MMW-COMPANY/2 — WORKING/public/nexus.html" "MMW-COMPANY/2 — WORKING/public/carpathia.html" "MMW-COMPANY/2 — WORKING/public/agrohub.html" "MMW-COMPANY/2 — WORKING/public/energy-park.html"
          git diff --cached --quiet && exit 0
          git commit -m "MMW-COMPANY/2: insert semantic photography into remaining projects"
          git push