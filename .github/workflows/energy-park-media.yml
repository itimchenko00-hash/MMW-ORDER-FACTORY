name: ENERGY PARK media import
on:
  push:
    paths:
      - ".github/workflows/energy-park-media.yml"
      - "public/ASSETS/ENERGY-PARK/photos/media-trigger.txt"
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/MMW-COMPANY-FROM-SCRATCH-2026-10-03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved Pexels assets
        run: |
          set -euo pipefail
          mkdir -p public/ASSETS/ENERGY-PARK/photos/web-selected
          curl -L --fail --retry 3 'https://images.pexels.com/photos/34302267/pexels-photo-34302267.jpeg?cs=srgb&dl=pexels-2mephoto-34302267.jpg&fm=jpg' -o public/ASSETS/ENERGY-PARK/photos/web-selected/01-hero.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/9889065/pexels-photo-9889065.jpeg?cs=srgb&dl=pexels-kindelmedia-9889065.jpg&fm=jpg' -o public/ASSETS/ENERGY-PARK/photos/web-selected/02-infrastructure.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/9889066/pexels-photo-9889066.jpeg?cs=srgb&dl=pexels-kindelmedia-9889066.jpg&fm=jpg' -o public/ASSETS/ENERGY-PARK/photos/web-selected/03-grid.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/9800022/pexels-photo-9800022.jpeg?cs=srgb&dl=pexels-kindelmedia-9800022.jpg&fm=jpg' -o public/ASSETS/ENERGY-PARK/photos/web-selected/04-industrial-park.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/3334038/pexels-photo-3334038.jpeg?cs=srgb&dl=pexels-jonathanborba-3334038.jpg&fm=jpg' -o public/ASSETS/ENERGY-PARK/photos/web-selected/05-transmission.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/36137497/pexels-photo-36137497.jpeg?cs=srgb&dl=pexels-mr-dr3igeteilt-2159455987-36137497.jpg&fm=jpg' -o public/ASSETS/ENERGY-PARK/photos/web-selected/06-substation.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/9889054/pexels-photo-9889054.jpeg?cs=srgb&dl=pexels-kindelmedia-9889054.jpg&fm=jpg' -o public/ASSETS/ENERGY-PARK/photos/web-selected/07-powerplant.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/8783541/pexels-photo-8783541.jpeg?cs=srgb&dl=pexels-rdne-8783541.jpg&fm=jpg' -o public/ASSETS/ENERGY-PARK/photos/web-selected/08-solar.jpg
          file public/ASSETS/ENERGY-PARK/photos/web-selected/*.jpg
          test $(find public/ASSETS/ENERGY-PARK/photos/web-selected -type f -name '*.jpg' | wc -l) -eq 8
      - name: Record media provenance
        run: |
          cat > public/ASSETS/ENERGY-PARK/photos/web-selected/SOURCES.md <<'EOF'
          # ENERGY PARK — media provenance
          
          All selected images are from Pexels and are used under the Pexels License. Pexels states that its photos are free for commercial use; depicted trademarks, brands, people and property remain subject to applicable third-party rights.
          
          01-hero.jpg — https://www.pexels.com/photo/industrial-power-plant-with-solar-panels-34302267/
          02-infrastructure.jpg — https://www.pexels.com/photo/aerial-footage-of-a-power-plant-9889065/
          03-grid.jpg — https://www.pexels.com/photo/power-plant-during-dusk-9889066/
          04-industrial-park.jpg — https://www.pexels.com/photo/landscape-sunset-skyline-industry-9800022/
          05-transmission.jpg — https://www.pexels.com/photo/power-lines-and-cooling-towers-against-cloudy-sky-kOhzjX618tE/
          06-substation.jpg — https://www.pexels.com/photo/power-plant-during-dusk-9889066/
          07-powerplant.jpg — https://www.pexels.com/photo/power-plant-9889054/
          08-solar.jpg — https://www.pexels.com/photo/an-aerial-shot-of-solar-panels-on-a-rooftop-8783541/
          EOF
      - name: Commit media
        run: |
          git config user.name 'MMW Factory'
          git config user.email 'actions@users.noreply.github.com'
          git add public/ASSETS/ENERGY-PARK/photos/web-selected
          git commit -m 'ENERGY PARK: import local semantic media set' || exit 0
          git push
