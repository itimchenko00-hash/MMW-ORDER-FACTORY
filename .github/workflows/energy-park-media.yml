name: ENERGY PARK media refresh

on:
  workflow_dispatch:
  push:
    branches:
      - MMW-COMPANY-FROM-SCRATCH-2026-10-03

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download curated Pexels media
        shell: bash
        run: |
          set -euo pipefail
          base="public/ASSETS/ENERGY-PARK/photos/web-selected"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/35454191/pexels-photo-35454191.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/01-hero.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/33626643/pexels-photo-33626643.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/02-development.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/2802106/pexels-photo-2802106.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/03-infrastructure.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/34718926/pexels-photo-34718926.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/04-industry.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/35691079/pexels-photo-35691079.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/05-energy-contour.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/11032766/pexels-photo-11032766.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/06-grid.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/10879339/pexels-photo-10879339.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/07-economic-context.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/29923347/pexels-photo-29923347.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/08-international.jpg"

      - name: Write source manifest
        shell: bash
        run: |
          cat > public/ASSETS/ENERGY-PARK/photos/web-selected/SOURCES.md <<'EOF'
# ENERGY PARK — media sources

Curated web media for the ENERGY PARK concept. Images are stored locally in the Factory project assets and the page references only these local copies.

All selected Pexels pages are marked **Free** / **Free to use** on the source pages at the time of selection.

| File | Semantic role | Source |
|---|---|---|
| 01-hero.jpg | Industrial energy environment / hero | https://www.pexels.com/photo/aerial-view-of-industrial-complex-in-china-35454191/ |
| 02-development.jpg | Industrial site / development context | https://www.pexels.com/photo/aerial-view-of-industrial-factory-complex-33626643/ |
| 03-infrastructure.jpg | Transmission infrastructure | https://www.pexels.com/photo/transmission-tower-2802106/ |
| 04-industry.jpg | Industrial users / production | https://www.pexels.com/photo/industrial-factory-interior-with-conveyor-belt-34718926/ |
| 05-energy-contour.jpg | Solar / energy generation | https://www.pexels.com/photo/aerial-view-of-rooftop-solar-panel-installation-35691079/ |
| 06-grid.jpg | Power network / connection | https://www.pexels.com/photo/transformer-on-a-transmission-tower-11032766/ |
| 07-economic-context.jpg | Grid scale / infrastructure network | https://www.pexels.com/photo/power-lines-connected-by-electric-posts-10879339/ |
| 08-international.jpg | Industrial park / international context | https://www.pexels.com/photo/aerial-view-of-modern-industrial-complex-with-solar-panels-29923347/ |
EOF

      - name: Connect local media to ENERGY PARK
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')
          marker='"energy-park":{'
          start=s.index(marker)
          m=s.index('media:[]',start)
          paths='media:["/ASSETS/ENERGY-PARK/photos/web-selected/01-hero.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/02-development.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/03-infrastructure.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/04-industry.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/05-energy-contour.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/06-grid.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/07-economic-context.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/08-international.jpg"]'
          s=s[:m]+paths+s[m+8:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify media uniqueness and local references
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          names=[p.name for p in Path('public/ASSETS/ENERGY-PARK/photos/web-selected').glob('*.jpg')]
          assert len(names)==8, names
          assert len(set(names))==8
          s=Path('public/app.js').read_text(encoding='utf-8')
          block=s[s.index('"energy-park":{'):s.index('},',s.index('"energy-park":{'))+3]
          refs=re.findall(r'/ASSETS/ENERGY-PARK/photos/web-selected/[^"\\]+\.jpg',block)
          assert len(refs)==8 and len(set(refs))==8, refs
          print('ENERGY PARK media: 8 unique local files / 8 unique references')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'MMW-COMPANY Factory'
          git config user.email 'itimchenko00-hash@users.noreply.github.com'
          git add public/ASSETS/ENERGY-PARK/photos/web-selected public/app.js
          git commit -m 'ENERGY PARK: install curated local media system' || echo 'No changes'
          git push
