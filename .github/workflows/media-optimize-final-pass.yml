name: MMW-COMPANY final heavy-media pass

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05
    paths:
      - ".github/workflows/media-optimize-final-pass.yml"

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 1

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --no-input Pillow

      - name: Optimize remaining heavy Factory images
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          root = Path("MMW-COMPANY/2 — WORKING/public/ASSETS")
          threshold = 900_000
          max_edge = 2400
          quality = 82
          changed = []
          before_total = after_total = 0

          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.suffix.lower() not in {".jpg", ".jpeg"}:
                  continue
              before = p.stat().st_size
              if before <= threshold:
                  continue
              before_total += before

              tmp = p.with_name(p.name + ".optimized")
              with Image.open(p) as im:
                  im.load()
                  old_dim = im.size
                  out = im.convert("RGB")
                  out.thumbnail((max_edge, max_edge), Image.Resampling.LANCZOS)
                  out.save(tmp, "JPEG", quality=quality, optimize=True, progressive=True, subsampling="4:2:0")
              after = tmp.stat().st_size

              if after < before * 0.98:
                  tmp.replace(p)
                  changed.append((p, before, after, old_dim, Image.open(p).size))
                  after_total += after
              else:
                  tmp.unlink(missing_ok=True)
                  after_total += before

          print("OPTIMIZED:", len(changed))
          for p,b,a,od,nd in changed:
              print(f"{p}: {b/1048576:.2f} -> {a/1048576:.2f} MB | {od} -> {nd}")
          print(f"BEFORE: {before_total/1048576:.2f} MB")
          print(f"AFTER:  {after_total/1048576:.2f} MB")
          print(f"SAVED:  {(before_total-after_total)/1048576:.2f} MB")

      - name: Verify all local JPEGs
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          root = Path("MMW-COMPANY/2 — WORKING/public/ASSETS")
          n=0
          for p in root.rglob("*"):
              if p.is_file() and p.suffix.lower() in {".jpg",".jpeg"}:
                  with Image.open(p) as im:
                      im.verify()
                  n += 1
          print("VALID JPEG FILES:", n)

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MMW-COMPANY media optimizer"
          git config user.email "itimchenko00@gmail.com"
          git rm -f ".github/workflows/media-optimize-final-pass.yml"
          git add -A "MMW-COMPANY/2 — WORKING/public/ASSETS"
          if git diff --cached --quiet; then
            echo "No remaining heavy-media changes."
            exit 0
          fi
          git commit -m "Finish Factory media payload optimization"
          git push origin HEAD:MMW-COMPANY-WORKSPACE-V1-2026-10-05
