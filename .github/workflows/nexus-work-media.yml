name: NEXUS WORK media import

on:
  push:
    branches:
      - NEXUS-WORK-MEDIA-RESET-2026-10-04

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download selected local project media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ASSETS/NEXUS-WORK/photos
          curl -fL --retry 3 --retry-all-errors 'https://images.unsplash.com/photo-1765371512971-9d4da531d004?w=1800&q=82&auto=format&fit=crop' -o ASSETS/NEXUS-WORK/photos/01-hero-business-hub.jpg
          curl -fL --retry 3 --retry-all-errors 'https://images.unsplash.com/photo-1747467327020-fb3a0225a70f?w=1800&q=82&auto=format&fit=crop' -o ASSETS/NEXUS-WORK/photos/02-workspace-coworking.jpg
          curl -fL --retry 3 --retry-all-errors 'https://images.unsplash.com/photo-1758518729711-1cbacd55efdb?w=1800&q=82&auto=format&fit=crop' -o ASSETS/NEXUS-WORK/photos/03-business-community.jpg
          curl -fL --retry 3 --retry-all-errors 'https://images.unsplash.com/photo-1758691736933-bb0f88fe2e0c?w=1800&q=82&auto=format&fit=crop' -o ASSETS/NEXUS-WORK/photos/04-business-location.jpg
          curl -fL --retry 3 --retry-all-errors 'https://images.unsplash.com/photo-1758691736722-cda1858056e0?w=1800&q=82&auto=format&fit=crop' -o ASSETS/NEXUS-WORK/photos/05-training-learning.jpg
          curl -fL --retry 3 --retry-all-errors 'https://images.unsplash.com/photo-1758873268745-dd2cf0d677b5?w=1800&q=82&auto=format&fit=crop' -o ASSETS/NEXUS-WORK/photos/06-economic-workspace.jpg
          curl -fL --retry 3 --retry-all-errors 'https://images.unsplash.com/photo-1703355685952-03ed19f70f51?w=1800&q=82&auto=format&fit=crop' -o ASSETS/NEXUS-WORK/photos/07-premium-office.jpg
          curl -fL --retry 3 --retry-all-errors 'https://images.unsplash.com/photo-1768508948485-a7adc1f3427f?w=1800&q=82&auto=format&fit=crop' -o ASSETS/NEXUS-WORK/photos/08-networking-hub.jpg
          curl -fL --retry 3 --retry-all-errors 'https://images.unsplash.com/photo-1758691737217-77302c5f988f?w=1800&q=82&auto=format&fit=crop' -o ASSETS/NEXUS-WORK/photos/09-teamwork-office.jpg
          file ASSETS/NEXUS-WORK/photos/*.jpg
          test "$(find ASSETS/NEXUS-WORK/photos -type f -name '*.jpg' | wc -l)" -eq 9

      - name: Commit imported media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ASSETS/NEXUS-WORK/photos/*.jpg
          git commit -m 'NEXUS WORK: import verified local project media'
          git push origin HEAD:NEXUS-WORK-MEDIA-RESET-2026-10-04
