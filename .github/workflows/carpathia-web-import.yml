name: CARPATHIA controlled web media import

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download approved web sources locally
        shell: bash
        run: |
          set -euo pipefail
          dir="public/ASSETS/CARPATHIA/photos/web-selected"
          mkdir -p "$dir"
          declare -A IMG
          IMG[01-hero.jpg]='https://images.pexels.com/photos/34350110/pexels-photo-34350110.jpeg?auto=compress&cs=tinysrgb&w=1800'
          IMG[02-stay.jpg]='https://images.pexels.com/photos/29748899/pexels-photo-29748899.jpeg?auto=compress&cs=tinysrgb&w=1800'
          IMG[03-nature.jpg]='https://images.pexels.com/photos/31429755/pexels-photo-31429755.jpeg?auto=compress&cs=tinysrgb&w=1800'
          IMG[04-food.jpg]='https://images.pexels.com/photos/32020820/pexels-photo-32020820.jpeg?auto=compress&cs=tinysrgb&w=1800'
          IMG[05-experience.jpg]='https://images.pexels.com/photos/31116919/pexels-photo-31116919.jpeg?auto=compress&cs=tinysrgb&w=1800'
          IMG[06-guest.jpg]='https://images.pexels.com/photos/8745678/pexels-photo-8745678.jpeg?auto=compress&cs=tinysrgb&w=1800'
          IMG[07-service.jpg]='https://images.pexels.com/photos/19980238/pexels-photo-19980238.jpeg?auto=compress&cs=tinysrgb&w=1800'
          IMG[08-model.jpg]='https://images.pexels.com/photos/13444094/pexels-photo-13444094.jpeg?auto=compress&cs=tinysrgb&w=1800'
          IMG[season-winter.jpg]='https://images.pexels.com/photos/16705646/pexels-photo-16705646.jpeg?auto=compress&cs=tinysrgb&w=1800'
          IMG[season-spring.jpg]='https://images.pexels.com/photos/37283423/pexels-photo-37283423.jpeg?auto=compress&cs=tinysrgb&w=1800'
          IMG[season-summer.jpg]='https://images.pexels.com/photos/26146560/pexels-photo-26146560.jpeg?auto=compress&cs=tinysrgb&w=1800'
          IMG[season-autumn.jpg]='https://images.pexels.com/photos/34350118/pexels-photo-34350118.jpeg?auto=compress&cs=tinysrgb&w=1800'
          for name in "${!IMG[@]}"; do
            out="$dir/$name"
            curl -L --fail --retry 3 --retry-delay 2 -A 'MMW-COMPANY controlled media import' "${IMG[$name]}" -o "$out"
            test "$(wc -c < "$out")" -gt 10000
            file "$out" | grep -qi 'jpeg\|jpg'
          done

      - name: Write provenance manifest
        shell: bash
        run: |
          cat > public/ASSETS/CARPATHIA/photos/web-selected/SOURCES.md <<'EOF'
          # CARPATHIA ECO LODGE — controlled web media sources

          Imported 2026-10-07 from new web sources. All selected pages are Pexels pages marked “Free to use”. Runtime uses only the local copies in this directory.

          | Local file | Semantic role | Source |
          |---|---|---|
          | 01-hero.jpg | Hero / Carpathian atmosphere | https://www.pexels.com/photo/misty-forest-in-carpathian-mountains-ukraine-34350110/ |
          | 02-stay.jpg | STAY / mountain accommodation context | https://www.pexels.com/photo/tranquil-wooden-cabin-in-carpathian-mountains-29748899/ |
          | 03-nature.jpg | NATURE / mountain lake | https://www.pexels.com/photo/serene-mountain-lake-in-carpathians-ukraine-31429755/ |
          | 04-food.jpg | FOOD / Ukrainian gastronomy | https://www.pexels.com/photo/traditional-ukrainian-borscht-with-sour-cream-32020820/ |
          | 05-experience.jpg | EXPERIENCE / hiking and outdoor route | https://www.pexels.com/photo/backpack-and-hiking-poles-in-carpathian-mountains-31116919/ |
          | 06-guest.jpg | GUEST / family nature experience | https://www.pexels.com/photo/family-relaxing-by-lake-in-mountains-8745678/ |
          | 07-service.jpg | SERVICE / wellness and recovery | https://www.pexels.com/photo/interior-of-sauna-cabin-19980238/ |
          | 08-model.jpg | MODEL / territory and landscape | https://www.pexels.com/photo/hills-with-forest-13444094/ |
          | season-winter.jpg | WINTER / Carpathian seasonal context | https://www.pexels.com/photo/mountains-landscape-in-the-carpathians-16705646/ |
          | season-spring.jpg | SPRING / lake and cabin | https://www.pexels.com/photo/tranquil-lake-and-cabin-in-ukraine-s-spring-landscape-37283423/ |
          | season-summer.jpg | SUMMER / hiking activity | https://www.pexels.com/photo/people-hiking-on-hill-in-evergreen-forest-26146560/ |
          | season-autumn.jpg | AUTUMN / misty Carpathian village | https://www.pexels.com/photo/misty-carpathians-village-scene-in-bukovel-34350118/ |

          No external image URL is used by the site runtime.
          EOF

      - name: Connect only CARPATHIA to the canonical renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')
          old='media:["/ASSETS/CARPATHIA/photos/09-hero.jpg","/ASSETS/CARPATHIA/photos/10-landscape.jpg","/ASSETS/CARPATHIA/photos/15-positioning.jpg"]'
          new='media:["/ASSETS/CARPATHIA/photos/web-selected/01-hero.jpg","/ASSETS/CARPATHIA/photos/web-selected/03-nature.jpg","/ASSETS/CARPATHIA/photos/web-selected/08-model.jpg"]'
          if old not in s:
              raise SystemExit('CARPATHIA media mapping not found; refusing unrelated changes')
          s=s.replace(old,new,1)
          old2='const chapterMedia=["/ASSETS/CARPATHIA/photos/01-territory.jpg","/ASSETS/CARPATHIA/photos/02-stay.jpg","/ASSETS/CARPATHIA/photos/03-nature.jpg","/ASSETS/CARPATHIA/photos/04-food.jpg","/ASSETS/CARPATHIA/photos/05-experience.jpg","/ASSETS/CARPATHIA/photos/06-guest.jpg","/ASSETS/CARPATHIA/photos/07-service.jpg","/ASSETS/CARPATHIA/photos/08-model.jpg"];'
          new2='const chapterMedia=["/ASSETS/CARPATHIA/photos/web-selected/01-hero.jpg","/ASSETS/CARPATHIA/photos/web-selected/02-stay.jpg","/ASSETS/CARPATHIA/photos/web-selected/03-nature.jpg","/ASSETS/CARPATHIA/photos/web-selected/04-food.jpg","/ASSETS/CARPATHIA/photos/web-selected/05-experience.jpg","/ASSETS/CARPATHIA/photos/web-selected/06-guest.jpg","/ASSETS/CARPATHIA/photos/web-selected/07-service.jpg","/ASSETS/CARPATHIA/photos/web-selected/08-model.jpg"];'
          if old2 not in s:
              raise SystemExit('CARPATHIA chapter mapping not found; refusing unrelated changes')
          s=s.replace(old2,new2,1)
          old3='const seasonMedia=["/ASSETS/CARPATHIA/photos/season-winter.jpg","/ASSETS/CARPATHIA/photos/season-spring.jpg","/ASSETS/CARPATHIA/photos/season-summer.jpg","/ASSETS/CARPATHIA/photos/season-autumn.jpg"];'
          new3='const seasonMedia=["/ASSETS/CARPATHIA/photos/web-selected/season-winter.jpg","/ASSETS/CARPATHIA/photos/web-selected/season-spring.jpg","/ASSETS/CARPATHIA/photos/web-selected/season-summer.jpg","/ASSETS/CARPATHIA/photos/web-selected/season-autumn.jpg"];'
          if old3 not in s:
              raise SystemExit('CARPATHIA season mapping not found; refusing unrelated changes')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit controlled import
        shell: bash
        run: |
          git config user.name 'MMW-COMPANY Controlled Media Import'
          git config user.email 'itimchenko00-hash@users.noreply.github.com'
          git add public/ASSETS/CARPATHIA/photos/web-selected public/app.js
          git diff --cached --quiet && exit 0
          git commit -m 'CARPATHIA: controlled web media import and semantic placement'
          git push
