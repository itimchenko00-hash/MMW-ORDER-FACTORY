name: AGROHUB controlled media import

on:
  push:
    paths:
      - ".github/workflows/agrohub-controlled-import.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import approved local media
        shell: bash
        run: |
          set -euo pipefail
          dir="public/ASSETS/AGROHUB/photos/web-selected"
          mkdir -p "$dir"
          curl -L --fail --retry 3 -o "$dir/01-agrohub-facility.jpg" "https://images.pexels.com/photos/33678221/pexels-photo-33678221.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-33678221.jpg&fm=jpg"
          curl -L --fail --retry 3 -o "$dir/02-grain-storage.jpg" "https://images.pexels.com/photos/2451421/pexels-photo-2451421.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-2451421.jpg&fm=jpg"
          curl -L --fail --retry 3 -o "$dir/03-raw-material-intake.jpg" "https://images.pexels.com/photos/2965707/pexels-photo-2965707.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-2965707.jpg&fm=jpg"
          curl -L --fail --retry 3 -o "$dir/04-processing-line.jpg" "https://images.pexels.com/photos/2889193/pexels-photo-2889193.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-2889193.jpg&fm=jpg"
          curl -L --fail --retry 3 -o "$dir/05-sorting-line.jpg" "https://images.pexels.com/photos/32578355/pexels-photo-32578355.jpeg?cs=srgb&dl=pexels-jonathan-david-1312107-32578355.jpg&fm=jpg"
          curl -L --fail --retry 3 -o "$dir/06-finished-product-logistics.jpg" "https://images.pexels.com/photos/11678431/pexels-photo-11678431.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-11678431.jpg&fm=jpg"
          cat > "$dir/SOURCES.md" <<'EOF'
# AGROHUB — controlled web media import

All six files were downloaded into this project repository and are served locally at runtime. No external image URL is used by the application.

## License / provenance

Source: Pexels, free-use pages.

1. 01-agrohub-facility.jpg — Aerial View of Agricultural Facility with Grain Silos — Mark Stebnicki
   https://www.pexels.com/photo/aerial-view-of-agricultural-facility-with-grain-silos-33678221/
   Semantic role: project hero / overall agro-infrastructure.

2. 02-grain-storage.jpg — Modern Farm Complex Storing of Grains — Mark Stebnicki
   https://www.pexels.com/photo/modern-farm-complex-storing-of-grains-2451421/
   Semantic role: storage / grain handling.

3. 03-raw-material-intake.jpg — A Truck Dumping Grains for Storing — Mark Stebnicki
   https://www.pexels.com/photo/a-truck-dumping-grains-for-storing-2965707/
   Semantic role: raw-material intake / receiving.

4. 04-processing-line.jpg — Processing of Sweet Potatoes in a Factory — Mark Stebnicki
   https://www.pexels.com/photo/processing-of-sweet-potatoes-in-a-factory-2889193/
   Semantic role: processing / technological line.

5. 05-sorting-line.jpg — Efficient Fruit Processing on Conveyor Belts — Jonathan David
   https://www.pexels.com/photo/efficient-fruit-processing-on-conveyor-belts-32578355/
   Semantic role: sorting / quality / production workflow.

6. 06-finished-product-logistics.jpg — Stacks of Brown Boxes Near Forklift — Mark Stebnicki
   https://www.pexels.com/photo/stacks-of-brown-boxes-near-forklift-11678431/
   Semantic role: finished product / warehouse / dispatch.

## Runtime rule

The source URLs above are provenance only. The website references only local /ASSETS/AGROHUB/photos/web-selected/ files.
EOF
          file "$dir"/*.jpg
          test "$(find "$dir" -maxdepth 1 -name '*.jpg' | wc -l)" -eq 6
          git config user.name "MMW-COMPANY Factory"
          git config user.email "itimchenko00@gmail.com"
          git add "$dir"
          git commit -m "AGROHUB: controlled local media import" || exit 0
          git push
