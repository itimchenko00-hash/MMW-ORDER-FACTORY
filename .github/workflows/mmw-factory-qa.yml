name: MMW Factory QA
on:
  push:
    branches:
      - MMW-FACTORY-GOVERNANCE-V1-2026-10-05
      - "MMW-COMPANY-*"
  pull_request:
jobs:
  factory-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run MMW Factory checks
        run: node MMW-FACTORY/checks/factory-checks.js
