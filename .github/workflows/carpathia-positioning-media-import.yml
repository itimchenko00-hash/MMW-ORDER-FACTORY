name: CARPATHIA positioning media import
on:
  push:
    branches:
      - MMW-COMPANY-FROM-SCRATCH-2026-10-03
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Download approved source and normalize
        run: |
          set -euo pipefail
          mkdir -p ASSETS/CARPATHIA/photos
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/b/b6/Ukrainian_Carpathian_Mountains._%D0%A3%D0%BA%D1%80%D0%B0%D0%B8%D0%BD%D0%B0%2C_%D0%9A%D0%B0%D1%80%D0%BF%D0%B0%D1%82%D1%8B.jpg' -o /tmp/source
          file /tmp/source
          convert /tmp/source -auto-orient -strip -resize '2400x2400>' -quality 88 ASSETS/CARPATHIA/photos/15-positioning.jpg
      - name: Validate binary and uniqueness
        run: |
          set -euo pipefail
          test -s ASSETS/CARPATHIA/photos/15-positioning.jpg
          identify -format '%m %wx%h\n' ASSETS/CARPATHIA/photos/15-positioning.jpg
          test "$(identify -format '%m' ASSETS/CARPATHIA/photos/15-positioning.jpg)" = "JPEG"
          sha256sum ASSETS/CARPATHIA/photos/15-positioning.jpg
          newhash="$(sha256sum ASSETS/CARPATHIA/photos/15-positioning.jpg | awk '{print $1}')"
          find ASSETS/CARPATHIA/photos -type f ! -name '15-positioning.jpg' -print0 | xargs -0 sha256sum > /tmp/existing-hashes || true
          if grep -q "$newhash" /tmp/existing-hashes; then
            echo "Duplicate image hash detected"
            exit 1
          fi
      - name: Commit image and remove temporary importer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/carpathia-positioning-media-import.yml
          git add ASSETS/CARPATHIA/photos/15-positioning.jpg .github/workflows/carpathia-positioning-media-import.yml
          git commit -m 'CARPATHIA: import semantic positioning media'
          git push
