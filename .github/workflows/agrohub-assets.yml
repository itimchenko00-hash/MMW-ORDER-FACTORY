name: AGROHUB local asset mirror
on:
  push:
    branches: [main]
    paths-ignore: ['ASSETS/AGROHUB/**']
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download catalog photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ASSETS/AGROHUB/photos
          declare -A IMG
          IMG[01-agro-audit.jpg]='https://images.unsplash.com/photo-1523742816428-4dca0b9b4a50?auto=format&fit=crop&w=1400&q=82'
          IMG[02-grain-receiving.jpg]='https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?auto=format&fit=crop&w=1400&q=82'
          IMG[03-storage-system.jpg]='https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=1400&q=82'
          IMG[04-drying-cleaning.jpg]='https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=1400&q=82'
          IMG[05-processing-line.jpg]='https://images.unsplash.com/photo-1565610222536-ef125c59da2e?auto=format&fit=crop&w=1400&q=82'
          IMG[06-packaging-label.jpg]='https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=1400&q=82'
          IMG[07-cold-storage.jpg]='https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=1400&q=82'
          IMG[08-agro-logistics.jpg]='https://images.unsplash.com/photo-1494412574643-ff11b0a5c1c3?auto=format&fit=crop&w=1400&q=82'
          IMG[09-export-preparation.jpg]='https://images.unsplash.com/photo-1494412685616-a5d310fbb07d?auto=format&fit=crop&w=1400&q=82'
          IMG[10-agrohub-masterplan.jpg]='https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1400&q=82'
          IMG[11-investment-model.jpg]='https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1400&q=82'
          IMG[12-full-agrohub.jpg]='https://images.unsplash.com/photo-1500076656116-558758c991c1?auto=format&fit=crop&w=1400&q=82'
          for name in "${!IMG[@]}"; do curl --fail --location --retry 3 --silent --show-error "${IMG[$name]}" -o "ASSETS/AGROHUB/photos/$name"; done
          printf '%s\n' '# AGROHUB permanent visual library' '' '12 unique thematic catalog photos mirrored into Factory by GitHub Actions.' 'The catalog is mapped one-to-one by product number.' > ASSETS/AGROHUB/README.md
      - name: Commit assets
        shell: bash
        run: |
          git config user.name 'MMW-COMPANY Factory'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ASSETS/AGROHUB
          git diff --cached --quiet && exit 0
          git commit -m 'AGROHUB ASSETS AUTO-MIRROR: store catalog photos in Factory'
          git push
