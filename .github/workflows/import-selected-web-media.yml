name: Import selected web media

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 1

      - name: Download controlled media
        run: node scripts/import-web-media.js

      - name: Validate local media
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          roots = [
            ("CARPATHIA", ["01-web-hero.jpg","02-web-nature.jpg","03-web-season.jpg"]),
            ("NEXUS-WORK", ["01-web-team.jpg","02-web-interior.jpg","03-web-coworking.jpg","04-web-meeting.jpg"]),
            ("NEXUS-LOGISTICS", ["01-web-warehouse.jpg","02-web-exterior.jpg","03-web-storage.jpg","04-web-flow.jpg"]),
            ("AGROHUB", ["01-web-processing.jpg","02-web-sorting.jpg","03-web-potato.jpg","04-web-grain.jpg"]),
            ("ENERGY-PARK", ["01-web-solar-aerial.jpg","02-web-industrial-rooftops.jpg","03-web-industrial-roof.jpg","04-web-solar-roof.jpg"]),
          ]
          seen = {}
          for project, names in roots:
              for name in names:
                  p = Path("public/ASSETS")/project/"photos"/"web-selected"/name
                  if not p.exists() or p.stat().st_size < 1024:
                      raise SystemExit(f"missing/invalid: {p}")
                  data=p.read_bytes()
                  if data[:2] != b"\xff\xd8":
                      raise SystemExit(f"not JPEG: {p}")
                  h=hashlib.sha256(data).hexdigest()
                  if h in seen:
                      raise SystemExit(f"duplicate binary: {p} == {seen[h]}")
                  seen[h]=str(p)
          print(f"validated {len(seen)} unique local JPEG assets")
          PY

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MMW Media Import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ASSETS
          if git diff --cached --quiet; then
            echo "No new media files to commit."
            exit 0
          fi
          git commit -m "media: commit controlled web-selected assets"
          git push origin HEAD:MMW-COMPANY-WORKSPACE-V1-2026-10-05
