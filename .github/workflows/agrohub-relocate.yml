name: AGROHUB asset relocation
on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05
    paths:
      - ".github/workflows/agrohub-relocate.yml"
permissions:
  contents: write
jobs:
  relocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 0
      - name: Restore verified binaries from previous live commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout 434223d797c6f86b4310a6ed2e11eadb1ad0b738 -- ASSETS/AGROHUB/photos
          mkdir -p "MMW-COMPANY/2 — WORKING/public/ASSETS/AGROHUB/photos/web-selected"
          cp ASSETS/AGROHUB/photos/*.jpg "MMW-COMPANY/2 — WORKING/public/ASSETS/AGROHUB/photos/web-selected/"
          rm -f ASSETS/AGROHUB/photos/*.jpg
          python - <<'PY'
          from pathlib import Path
          p=Path("MMW-COMPANY/2 — WORKING/public/agrohub.html")
          s=p.read_text()
          s=s.replace("/ASSETS/AGROHUB/photos/","/ASSETS/AGROHUB/photos/web-selected/")
          p.write_text(s)
          PY
          for f in "MMW-COMPANY/2 — WORKING/public/ASSETS/AGROHUB/photos/web-selected/"*.jpg; do
            test -s "$f"
            file "$f" | grep -Eqi 'JPEG image data|JFIF'
          done
          git config user.name "MMW Factory"
          git config user.email "itimchenko00@gmail.com"
          git add "MMW-COMPANY/2 — WORKING/public/ASSETS/AGROHUB/photos/web-selected" "MMW-COMPANY/2 — WORKING/public/agrohub.html" ASSETS/AGROHUB/photos
          git commit -m "AGROHUB: restore verified media in active project asset path"
          git push origin HEAD:MMW-COMPANY-WORKSPACE-V1-2026-10-05
