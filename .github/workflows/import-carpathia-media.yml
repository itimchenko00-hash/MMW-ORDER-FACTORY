name: Import CARPATHIA web-selected media

on:
  push:
    paths:
      - ".github/workflows/import-carpathia-media.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 1

      - name: Download controlled web assets
        shell: bash
        run: |
          set -euo pipefail
          base="public/ASSETS/CARPATHIA/photos/web-selected"
          mkdir -p "$base"

          download() {
            local id="$1"
            local name="$2"
            curl --fail --location --retry 3 --retry-all-errors               --output "$base/$name"               "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=2400"
            test -s "$base/$name"
            file "$base/$name"
          }

          download 32059124 "01-hero.jpg"
          download 27582055 "02-stay.jpg"
          download 31797840 "03-nature.jpg"
          download 38917194 "04-food.jpg"
          download 35801449 "05-experience.jpg"
          download 7431138 "06-guest.jpg"
          download 29306914 "07-service.jpg"
          download 8321633 "08-model.jpg"
          download 35111475 "season-winter.jpg"
          download 36891260 "season-spring.jpg"
          download 34486037 "season-summer.jpg"
          download 18012291 "season-autumn.jpg"

      - name: Validate image set
        shell: bash
        run: |
          set -euo pipefail
          base="public/ASSETS/CARPATHIA/photos/web-selected"
          expected=(
            01-hero.jpg 02-stay.jpg 03-nature.jpg 04-food.jpg
            05-experience.jpg 06-guest.jpg 07-service.jpg 08-model.jpg
            season-winter.jpg season-spring.jpg season-summer.jpg season-autumn.jpg
          )
          for f in "${expected[@]}"; do
            test -s "$base/$f"
          done
          test "$(find "$base" -maxdepth 1 -type f \( -name '*.jpg' -o -name '*.jpeg' \) | wc -l)" -eq 12

      - name: Commit imported media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MMW-COMPANY media importer"
          git config user.email "itimchenko00@gmail.com"
          git add public/ASSETS/CARPATHIA/photos/web-selected
          git commit -m "MEDIA: import new CARPATHIA web-selected photos" || exit 0
          git push origin MMW-COMPANY-WORKSPACE-V1-2026-10-05
