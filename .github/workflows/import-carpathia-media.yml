name: CARPATHIA one-time controlled media import

on:
  push:
    paths:
      - ".github/workflows/import-carpathia-media.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 1
      - name: Import selected Pexels originals to local Factory assets
        shell: bash
        run: |
          set -euo pipefail
          base="public/ASSETS/CARPATHIA/photos/web-selected"
          mkdir -p "$base"
          download() {
            local name="$1"; local url="$2"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 -A 'MMW-COMPANY/2 controlled media import' --output "$base/$name" "$url"
            test -s "$base/$name"
            test "$(wc -c < "$base/$name")" -gt 10000
            test "$(xxd -l 2 -p "$base/$name")" = "ffd8"
          }
          download "01-hero.jpg" "https://images.pexels.com/photos/34350110/pexels-photo-34350110.jpeg?cs=srgb&fm=jpg"
          download "02-stay.jpg" "https://images.pexels.com/photos/27582055/pexels-photo-27582055.jpeg?cs=srgb&fm=jpg"
          download "03-nature.jpg" "https://images.pexels.com/photos/40053003/pexels-photo-40053003.jpeg?cs=srgb&fm=jpg"
          download "04-food.jpg" "https://images.pexels.com/photos/9491136/pexels-photo-9491136.jpeg?cs=srgb&fm=jpg"
          download "05-experience.jpg" "https://images.pexels.com/photos/18043033/pexels-photo-18043033.jpeg?cs=srgb&fm=jpg"
          download "06-guest.jpg" "https://images.pexels.com/photos/6534913/pexels-photo-6534913.jpeg?cs=srgb&fm=jpg"
          download "07-service.jpg" "https://images.pexels.com/photos/39912930/pexels-photo-39912930.jpeg?cs=srgb&fm=jpg"
          download "08-model.jpg" "https://images.pexels.com/photos/39893535/pexels-photo-39893535.jpeg?cs=srgb&fm=jpg"
          download "season-winter.jpg" "https://images.pexels.com/photos/29306749/pexels-photo-29306749.jpeg?cs=srgb&fm=jpg"
          download "season-spring.jpg" "https://images.pexels.com/photos/36836048/pexels-photo-36836048.jpeg?cs=srgb&fm=jpg"
          download "season-summer.jpg" "https://images.pexels.com/photos/5129714/pexels-photo-5129714.jpeg?cs=srgb&fm=jpg"
          download "season-autumn.jpg" "https://images.pexels.com/photos/36048724/pexels-photo-36048724.jpeg?cs=srgb&fm=jpg"
      - name: Validate unique local media set
        shell: bash
        run: |
          set -euo pipefail
          base="public/ASSETS/CARPATHIA/photos/web-selected"
          files=(01-hero.jpg 02-stay.jpg 03-nature.jpg 04-food.jpg 05-experience.jpg 06-guest.jpg 07-service.jpg 08-model.jpg season-winter.jpg season-spring.jpg season-summer.jpg season-autumn.jpg)
          for f in "${files[@]}"; do test -s "$base/$f"; done
          test "${#files[@]}" -eq 12
          test "$(find "$base" -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 12
          test "$(sha256sum "${files[@]/#/$base/}" | awk '{print $1}' | sort -u | wc -l)" -eq 12
      - name: Commit imported binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MMW-COMPANY media importer"
          git config user.email "itimchenko00@gmail.com"
          git add public/ASSETS/CARPATHIA/photos/web-selected
          git commit -m "MEDIA: controlled CARPATHIA web-selected import" || exit 0
          git push origin MMW-COMPANY-WORKSPACE-V1-2026-10-05
