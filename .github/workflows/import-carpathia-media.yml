name: Import CARPATHIA ECO LODGE web media

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05

permissions:
  contents: write

jobs:
  import-carpathia-media:
    if: ${{ contains(github.event.head_commit.message, '[carpathia-media-import]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved Pexels media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/ASSETS/CARPATHIA/photos/web-selected
          curl -L --fail --retry 3 "https://images.pexels.com/photos/34350114/pexels-photo-34350114.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/01-hero-carpathian-mist.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/29748899/pexels-photo-29748899.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/02-stay-cabin.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/37283423/pexels-photo-37283423.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/03-nature-lake.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/38982999/pexels-photo-38982999.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/04-food-mountain-restaurant.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/26146565/pexels-photo-26146565.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/05-experience-hiking.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/31116919/pexels-photo-31116919.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/06-guest-family.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/11566663/pexels-photo-11566663.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/07-service-hospitality.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/26146533/pexels-photo-26146533.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/08-model-landscape.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/34350118/pexels-photo-34350118.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/09-layer-mountains.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/40042110/pexels-photo-40042110.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/10-positioning-retreat.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/19387131/pexels-photo-19387131.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/season-winter.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/37862891/pexels-photo-37862891.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/season-spring.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/29813169/pexels-photo-29813169.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/season-summer.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/22589067/pexels-photo-22589067.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/season-autumn.jpg

      - name: Validate imported files
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/ASSETS/CARPATHIA/photos/web-selected -maxdepth 1 -type f -name '*.jpg' | wc -l)" -ge 14
          for f in public/ASSETS/CARPATHIA/photos/web-selected/*.jpg; do
            test -s "$f"
            file "$f" | grep -Eiq 'JPEG image data|JFIF'
          done

      - name: Write provenance register
        shell: bash
        run: |
          cat > public/ASSETS/CARPATHIA/photos/web-selected/SOURCES.md <<'EOF'
          # CARPATHIA ECO LODGE — controlled web media register

          Workflow: WEB SOURCE → CONTROLLED IMPORT → LOCAL FACTORY ASSET → SEMANTIC PLACEMENT → PROVENANCE → QA → LIVE.
          Runtime policy: local files only; no external image hotlinks.
          Source license basis: Pexels pages marked Free to use / Free download at selection time.
          Project honesty: images are thematic visual references for a concept and do not depict a constructed CARPATHIA ECO LODGE project.

          | File | Semantic role | Source |
          |---|---|---|
          | 01-hero-carpathian-mist.jpg | Foggy mountain village / territory hero | https://www.pexels.com/photo/foggy-mountain-village-in-carpathians-ukraine-34350114/ |
          | 02-stay-cabin.jpg | STAY / accommodation | https://www.pexels.com/photo/tranquil-wooden-cabin-in-carpathian-mountains-29748899/ |
          | 03-nature-lake.jpg | NATURE / spring landscape | https://www.pexels.com/photo/tranquil-lake-and-cabin-in-ukraine-s-spring-landscape-37283423/ |
          | 04-food-mountain-restaurant.jpg | HOSPITALITY / guest interior | https://www.pexels.com/photo/cozy-wooden-cabin-interior-with-natural-light-38982999/ |
          | 05-experience-hiking.jpg | EXPERIENCE / mountain trail | https://www.pexels.com/photo/fog-over-dirt-road-on-hill-in-mountains-26146565/ |
          | 06-guest-family.jpg | GUEST / outdoor experience | https://www.pexels.com/photo/backpack-and-hiking-poles-in-carpathian-mountains-31116919/ |
          | 07-service-hospitality.jpg | ACCESS / arrival and context | https://www.pexels.com/photo/retro-cars-and-vans-in-the-parking-lot-11566663/ |
          | 08-model-landscape.jpg | MODEL / territory scale | https://www.pexels.com/photo/forest-on-hills-in-countryside-26146533/ |
          | 09-layer-mountains.jpg | PRODUCT / settlement and landscape layer | https://www.pexels.com/photo/misty-carpathians-village-scene-in-bukovel-34350118/ |
          | 10-positioning-retreat.jpg | POSITIONING / destination journey | https://www.pexels.com/photo/scenic-mountain-road-at-sunset-40042110/ |
          | season-winter.jpg | Winter scenario | https://www.pexels.com/photo/forest-in-snow-with-mountain-behind-19387131/ |
          | season-spring.jpg | Spring scenario | https://www.pexels.com/photo/scenic-spring-landscape-in-carpathian-mountains-37862891/ |
          | season-summer.jpg | Summer scenario | https://www.pexels.com/photo/scenic-mountain-lake-view-with-snowy-peaks-29813169/ |
          | season-autumn.jpg | Autumn / mountain activity scenario | https://www.pexels.com/photo/chairlift-in-mountains-in-summer-22589067/ |
          EOF

      - name: Commit imported media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ASSETS/CARPATHIA/photos/web-selected
          if git diff --cached --quiet; then
            echo "CARPATHIA media already synchronized."
            exit 0
          fi
          git commit -m "CARPATHIA: controlled web media import"
          git push
