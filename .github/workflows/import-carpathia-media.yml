name: Import CARPATHIA ECO LODGE web media

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05

permissions:
  contents: write

jobs:
  import-carpathia-media:
    if: ${{ contains(github.event.head_commit.message, '[carpathia-media-import]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved Pexels media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/ASSETS/CARPATHIA/photos/web-selected
          curl -L --fail --retry 3 "https://images.pexels.com/photos/34350110/pexels-photo-34350110.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/01-hero-carpathian-mist.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/37817130/pexels-photo-37817130.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/02-stay-cabin.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/31429755/pexels-photo-31429755.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/03-nature-lake.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/9318571/pexels-photo-9318571.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/04-food-mountain-restaurant.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/26146560/pexels-photo-26146560.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/05-experience-hiking.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/8745678/pexels-photo-8745678.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/06-guest-family.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/7539892/pexels-photo-7539892.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/07-service-hospitality.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/13444094/pexels-photo-13444094.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/08-model-landscape.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/34483114/pexels-photo-34483114.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/09-layer-mountains.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/29782118/pexels-photo-29782118.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/10-positioning-retreat.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/28996646/pexels-photo-28996646.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/season-winter.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/37283421/pexels-photo-37283421.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/season-spring.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/29748900/pexels-photo-29748900.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/season-summer.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/16705646/pexels-photo-16705646.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/CARPATHIA/photos/web-selected/season-autumn.jpg

      - name: Validate imported files
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/ASSETS/CARPATHIA/photos/web-selected -maxdepth 1 -type f -name '*.jpg' | wc -l)" -ge 14
          for f in public/ASSETS/CARPATHIA/photos/web-selected/*.jpg; do
            test -s "$f"
            file "$f" | grep -Eiq 'JPEG image data|JFIF'
          done

      - name: Write provenance register
        shell: bash
        run: |
          cat > public/ASSETS/CARPATHIA/photos/web-selected/SOURCES.md <<'EOF'
          # CARPATHIA ECO LODGE — controlled web media register

          Workflow: WEB SOURCE → CONTROLLED IMPORT → LOCAL FACTORY ASSET → SEMANTIC PLACEMENT → PROVENANCE → QA → LIVE.
          Runtime policy: local files only; no external image hotlinks.
          Source license basis: Pexels pages marked Free to use / Free download at selection time.
          Project honesty: images are thematic visual references for a concept and do not depict a constructed CARPATHIA ECO LODGE project.

          | File | Semantic role | Source |
          |---|---|---|
          | 01-hero-carpathian-mist.jpg | Hero / territory | https://www.pexels.com/photo/misty-forest-in-carpathian-mountains-ukraine-34350110/ |
          | 02-stay-cabin.jpg | STAY / accommodation | https://www.pexels.com/photo/idyllic-mountain-cabin-in-ukrainian-countryside-37817130/ |
          | 03-nature-lake.jpg | NATURE / landscape | https://www.pexels.com/photo/serene-mountain-lake-in-carpathians-ukraine-31429755/ |
          | 04-food-mountain-restaurant.jpg | FOOD / hospitality | https://www.pexels.com/photo/wood-restaurant-landscape-mountains-9318571/ |
          | 05-experience-hiking.jpg | EXPERIENCE / routes | https://www.pexels.com/photo/people-hiking-on-hill-in-evergreen-forest-26146560/ |
          | 06-guest-family.jpg | GUEST / family segment | https://www.pexels.com/photo/family-relaxing-by-lake-in-mountains-8745678/ |
          | 07-service-hospitality.jpg | SERVICE / guest service | https://www.pexels.com/photo/tables-and-chairs-inside-the-restaurant-with-mountain-view-7539892/ |
          | 08-model-landscape.jpg | MODEL / capacity context | https://www.pexels.com/photo/hills-with-forest-13444094/ |
          | 09-layer-mountains.jpg | Product / architecture-landscape layer | https://www.pexels.com/photo/mountain-landscape-in-carpathians-under-clear-blue-sky-34483114/ |
          | 10-positioning-retreat.jpg | Positioning / retreat experience | https://www.pexels.com/photo/relaxing-in-the-scenic-carpathian-mountains-29782118/ |
          | season-winter.jpg | Winter scenario | https://www.pexels.com/photo/snowy-carpathian-winter-landscape-in-ukraine-28996646/ |
          | season-spring.jpg | Spring scenario | https://www.pexels.com/photo/tranquil-forest-path-in-springtime-ukraine-37283421/ |
          | season-summer.jpg | Summer scenario | https://www.pexels.com/photo/serene-summer-landscape-in-the-carpathians-29748900/ |
          | season-autumn.jpg | Autumn scenario | https://www.pexels.com/photo/mountains-landscape-in-the-carpathians-16705646/ |
          EOF

      - name: Commit imported media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ASSETS/CARPATHIA/photos/web-selected
          if git diff --cached --quiet; then
            echo "CARPATHIA media already synchronized."
            exit 0
          fi
          git commit -m "CARPATHIA: controlled web media import"
          git push
