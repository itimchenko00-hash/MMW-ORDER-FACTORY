name: logistics-media-import
on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 0
      - name: Reset previous logistics media layers
        run: |
          find "MMW-COMPANY/2 — WORKING/public/ASSETS" -type d \( -iname '*logistics*' -o -iname '*nexus-logistics*' \) -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf "MMW-COMPANY/2 — WORKING/public/assets/logistics" "MMW-COMPANY/2 — WORKING/public/assets/nexus-logistics" 2>/dev/null || true
          mkdir -p "MMW-COMPANY/2 — WORKING/public/ASSETS/NEXUS-LOGISTICS/photos/web-selected"
      - name: Controlled binary import from Wikimedia Commons
        env:
          BASE: "MMW-COMPANY/2 — WORKING/public/ASSETS/NEXUS-LOGISTICS/photos/web-selected"
        run: |
          set -euo pipefail
          ua="MMW-COMPANY/2 controlled media import"
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error -A "$ua" "https://upload.wikimedia.org/wikipedia/commons/b/b9/Container_cranes_at_the_MPET-_MSC_PSA_European_Terminal_in_Port_of_Antwerp_%28Kieldrecht%2C_Belgium%29_during_the_sunset_civil_twilight_%28DSCF3919%29.jpg" -o "$BASE/01-hero-terminal.jpg"
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error -A "$ua" "https://upload.wikimedia.org/wikipedia/commons/9/9e/Intermodal_Containers_on_Freight_Train%2C_August_29_2025.jpg" -o "$BASE/02-supply-rail.jpg"
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error -A "$ua" "https://upload.wikimedia.org/wikipedia/commons/7/77/Container_loading_with_forklift_at_warehouse_in_Thailand.jpg" -o "$BASE/03-receiving-forklift.jpg"
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error -A "$ua" "https://upload.wikimedia.org/wikipedia/commons/9/9e/Larkin_Terminal_Warehouse.jpg" -o "$BASE/04-storage-warehouse.jpg"
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error -A "$ua" "https://upload.wikimedia.org/wikipedia/commons/6/6b/Modern_loading_dock.jpg" -o "$BASE/05-processing-dock.jpg"
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error -A "$ua" "https://upload.wikimedia.org/wikipedia/commons/f/fe/Canadian_Pacific_Railway_yard%2C_Port_Coquitlam_BC_-_5946477920.jpg" -o "$BASE/06-distribution-yard.jpg"
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error -A "$ua" "https://upload.wikimedia.org/wikipedia/commons/3/3f/Row_of_Trailer_Trucks_at_a_Loading_Dock_Warehouse_-_DPLA_-_def951fbf4581639fe4eb05f0f289b26.jpg" -o "$BASE/07-clients-trucks.jpg"
          curl -L --fail --retry 3 --retry-delay 3 --silent --show-error -A "$ua" "https://upload.wikimedia.org/wikipedia/commons/4/45/Seattle_-_Sodo_rail_yard_05.jpg" -o "$BASE/08-crossdock-rail.jpg"
          test "$(find "$BASE" -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 8
          for f in "$BASE"/*.jpg; do
            test "$(file -b --mime-type "$f")" = "image/jpeg"
            test "$(stat -c%s "$f")" -gt 50000
          done
      - name: Write provenance
        env:
          BASE: "MMW-COMPANY/2 — WORKING/public/ASSETS/NEXUS-LOGISTICS"
        run: |
          cat > "$BASE/SOURCES.md" <<'EOF'
          # NEXUS LOGISTICS — media provenance
          
          Active media follows: WEB SOURCE → CONTROLLED IMPORT → LOCAL FACTORY ASSET → SEMANTIC PLACEMENT → PROVENANCE → QA → LIVE.
          
          01-hero-terminal.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Container_cranes_at_the_MPET-_MSC_PSA_European_Terminal_in_Port_of_Antwerp_(Kieldrecht,_Belgium)_during_the_sunset_civil_twilight_(DSCF3919).jpg
          - Author: source page on Wikimedia Commons
          - License: CC BY 4.0
          - Meaning: hero / container terminal / network scale.
          
          02-supply-rail.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Intermodal_Containers_on_Freight_Train,_August_29_2025.jpg
          - Author: Dillan Payne
          - License: CC BY-SA 4.0
          - Meaning: supply / incoming intermodal flow.
          
          03-receiving-forklift.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Container_loading_with_forklift_at_warehouse_in_Thailand.jpg
          - Author: Goterrestrial
          - License: CC BY 4.0
          - Meaning: receiving / loading / warehouse operation.
          
          04-storage-warehouse.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Larkin_Terminal_Warehouse.jpg
          - Author: Fortunate4now
          - License: CC0 1.0
          - Meaning: storage / warehouse infrastructure.
          
          05-processing-dock.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Modern_loading_dock.jpg
          - Author: source page on Wikimedia Commons
          - License: CC BY-SA 4.0
          - Meaning: processing / loading dock / operational interface.
          
          06-distribution-yard.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Canadian_Pacific_Railway_yard,_Port_Coquitlam_BC_-_5946477920.jpg
          - Author: source page on Wikimedia Commons
          - License: CC BY 2.0
          - Meaning: distribution / intermodal yard / regional movement.
          
          07-clients-trucks.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Row_of_Trailer_Trucks_at_a_Loading_Dock_Warehouse_-_DPLA_-_def951fbf4581639fe4eb05f0f289b26.jpg
          - Author: Digital Public Library of America source
          - License: public-domain source designation on Wikimedia Commons
          - Meaning: clients / outbound distribution / market-facing capacity.
          
          08-crossdock-rail.jpg
          - Source: https://commons.wikimedia.org/wiki/File:Seattle_-_Sodo_rail_yard_05.jpg
          - Author: Joe Mabel
          - License: CC BY-SA 3.0
          - Meaning: cross-dock / rail handling / transfer node.
          
          Policy: no generated, synthetic, placeholder, external-runtime, proxy or remotely transformed images are activated. All active images are local JPEG binaries with provenance.
          EOF
      - name: Commit imported media
        run: |
          git config user.name "MMW Media Import"
          git config user.email "actions@users.noreply.github.com"
          git add -A "MMW-COMPANY/2 — WORKING/public/ASSETS"
          git commit -m "chore: import NEXUS LOGISTICS media"
          git push origin HEAD:MMW-COMPANY-WORKSPACE-V1-2026-10-05
