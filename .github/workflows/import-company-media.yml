# ALADIN media integration will use the same controlled import methodology.
name: Import MMW-COMPANY contextual media

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05

permissions:
  contents: write

jobs:
  import-context-media:
    if: ${{ contains(github.event.head_commit.message, '[catalog-media-import]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare media folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/photos/catalog"
          mkdir -p "MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/photos/hero"

      - name: Download approved contextual photography
        shell: bash
        run: |
          set -euo pipefail
          base="MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/photos/catalog"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1772381617907-548a1b6ccca3?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/01-real-estate-development.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1779517226273-bcf843b759b9?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/02-logistics-distribution.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1770892123242-c876a0a343f5?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/03-agriculture-production.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1749402676657-bb3299fdd5a5?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/04-energy-infrastructure.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1778877035089-c80dcb877f45?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/05-education-training.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1767611130251-5e0272468944?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/06-health-wellness.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1776705865382-585208da8045?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/07-sports-active.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1556741533-6e6a62bd8b49?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/08-service-hub.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1758876022836-70b89d3e6944?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/09-digital-business.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1773047747593-b2f10e0579c5?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/10-custom-project.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1769738360873-3ba6cac0b308?auto=format&fit=crop&fm=jpg&q=82&w=2400" -o "MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/photos/hero/project-development-method.jpg"

      - name: Validate imported photography
        shell: bash
        run: |
          set -euo pipefail
          base="MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/photos/catalog"
          test "$(find "$base" -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 10
          test -s "MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/photos/hero/project-development-method.jpg"
          for f in "$base"/*.jpg "MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/photos/hero/project-development-method.jpg"; do
            test -s "$f"
            file "$f" | grep -Eiq 'JPEG|image'
          done

      - name: Connect photography to information blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("MMW-COMPANY/2 — WORKING/public/index.html")
          s=p.read_text(encoding="utf-8")

          css_old=".card{background:white;border:1px solid var(--line);border-radius:var(--r);padding:23px;min-height:205px;text-align:left;transition:.3s;overflow:hidden}"
          css_new=".card{background:white;border:1px solid var(--line);border-radius:var(--r);padding:15px;min-height:300px;text-align:left;transition:.3s;overflow:hidden}.cardMedia{height:122px;border-radius:16px;overflow:hidden;position:relative;margin-bottom:15px;background:var(--ink)}.cardMedia img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.82) contrast(1.03);transition:.45s}.card:hover .cardMedia img,.card.on .cardMedia img{transform:scale(1.035);filter:saturate(1) contrast(1.04)}.cardMedia:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#061a1708,#061a1752)}.cardMedia span{position:absolute;left:12px;bottom:10px;z-index:1;color:white;font-size:8px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.cardInfo{padding:0 8px 8px}.cardInfo p{min-height:38px}.card.on .cardInfo p{color:#b5c5bf}"
          if css_old not in s: raise SystemExit("catalog card CSS anchor missing")
          s=s.replace(css_old,css_new,1)

          hero_old='<div class="engine"><b>MMW PROJECT ENGINE</b>'
          hero_new='<div class="heroVisual"><div class="heroMedia"><img src="/ASSETS/MMW-COMPANY/photos/hero/project-development-method.jpg" alt="Командная работа над структурой и развитием проекта" loading="eager"><div><b>PROJECT DEVELOPMENT</b><span>От идеи к структурированной модели</span></div></div><div class="engine"><b>MMW PROJECT ENGINE</b>'
          if hero_old not in s: raise SystemExit("hero anchor missing")
          s=s.replace(hero_old,hero_new,1)
          s=s.replace('</div><div class="engine"><b>MMW PROJECT ENGINE</b>', '</div><div class="engine"><b>MMW PROJECT ENGINE</b>',1)
          # Close heroVisual after engine block: target the exact existing hero ending.
          target='<p>Для каждого проекта формируется собственная модель ценности, экономики и реализации.</p></div></div></section>'
          repl='<p>Для каждого проекта формируется собственная модель ценности, экономики и реализации.</p></div></div></div></section>'
          if target not in s: raise SystemExit("hero closing anchor missing")
          s=s.replace(target,repl,1)

          marker='.heroGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center}'
          replacement='.heroGrid{display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:center}.heroVisual{display:grid;gap:14px}.heroMedia{height:250px;border-radius:28px;overflow:hidden;position:relative;background:var(--ink);box-shadow:var(--sh)}.heroMedia img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.78) contrast(1.03)}.heroMedia:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#061a1710,#061a1780)}.heroMedia>div{position:absolute;left:22px;bottom:19px;z-index:1;color:white}.heroMedia b{display:block;color:var(--m);font-size:9px;letter-spacing:.12em}.heroMedia span{display:block;margin-top:6px;font-size:14px;font-weight:800}'
          if marker not in s: raise SystemExit("hero CSS anchor missing")
          s=s.replace(marker,replacement,1)

          media={
            "REAL ESTATE DEVELOPMENT":("/ASSETS/MMW-COMPANY/photos/catalog/01-real-estate-development.jpg","Площадка и архитектурный продукт"),
            "LOGISTICS & DISTRIBUTION":("/ASSETS/MMW-COMPANY/photos/catalog/02-logistics-distribution.jpg","Поток, склад и распределение"),
            "AGRICULTURE & PRODUCTION":("/ASSETS/MMW-COMPANY/photos/catalog/03-agriculture-production.jpg","Производство и аграрный ресурс"),
            "ENERGY & INFRASTRUCTURE":("/ASSETS/MMW-COMPANY/photos/catalog/04-energy-infrastructure.jpg","Генерация и инфраструктура"),
            "EDUCATION & TRAINING HUB":("/ASSETS/MMW-COMPANY/photos/catalog/05-education-training.jpg","Обучение и развитие компетенций"),
            "HEALTH & WELLNESS":("/ASSETS/MMW-COMPANY/photos/catalog/06-health-wellness.jpg","Физическое благополучие и восстановление"),
            "SPORTS & ACTIVE LIFESTYLE":("/ASSETS/MMW-COMPANY/photos/catalog/07-sports-active.jpg","Тренировка и активный сценарий"),
            "SERVICE HUB":("/ASSETS/MMW-COMPANY/photos/catalog/08-service-hub.jpg","Сервис и контакт с клиентом"),
            "DIGITAL BUSINESS":("/ASSETS/MMW-COMPANY/photos/catalog/09-digital-business.jpg","Цифровой продукт и совместная работа"),
            "CUSTOM PROJECT":("/ASSETS/MMW-COMPANY/photos/catalog/10-custom-project.jpg","Исходные данные и проектная навигация")
          }
          import json
          decl="const CATALOG_MEDIA="+json.dumps(media,ensure_ascii=False,separators=(",",":"))+";"
          if "const CATALOG_MEDIA=" not in s:
              s=s.replace('const cg=document.getElementById("catalogGrid");',decl+'const cg=document.getElementById("catalogGrid");',1)

          old_render='b.innerHTML=\'<span class="num">\'+x[0]+\'</span><div class="ico">\'+x[3]+\'</div><h3>\'+x[1]+\'</h3><p>\'+x[2]+\'</p><div class="more"><b>Проектный контур</b><ul>\'+x[4].map(y=>\'<li>\'+y+\'</li>\').join("")+\'</ul></div>\';'
          new_render='const m=CATALOG_MEDIA[x[1]]||["",""];b.innerHTML=\'<span class="num">\'+x[0]+\'</span><div class="cardMedia"><img src="\'+m[0]+\'" alt="\'+x[1]+\' — \'+m[1]+\'" loading="lazy"><span>\'+m[1]+\'</span></div><div class="cardInfo"><div class="ico">\'+x[3]+\'</div><h3>\'+x[1]+\'</h3><p>\'+x[2]+\'</p><div class="more"><b>Проектный контур</b><ul>\'+x[4].map(y=>\'<li>\'+y+\'</li>\').join("")+\'</ul></div></div>\';'
          if old_render not in s: raise SystemExit("catalog renderer not found")
          s=s.replace(old_render,new_render,1)
          p.write_text(s,encoding="utf-8")
          PY

      - name: Write contextual media provenance
        shell: bash
        run: |
          cat > "MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/photos/catalog/SOURCES.md" <<'EOF'
          # MMW-COMPANY — contextual catalog media register

          These photographs are imported as semantic visual information for the ten interactive catalog cards. They are not a gallery. Each image explains the operating context of its direction and is used only in its assigned block.

          | File | Direction | Semantic role | Source page |
          |---|---|---|---|
          | 01-real-estate-development.jpg | REAL ESTATE DEVELOPMENT | architecture / development | https://unsplash.com/photos/concrete-building-under-construction-against-blue-sky-x1XjH6Icr0A |
          | 02-logistics-distribution.jpg | LOGISTICS & DISTRIBUTION | warehouse / distribution / transport | https://unsplash.com/photos/a-forklift-loads-pallets-of-goods-into-a-truck-qBD1__CH_MI |
          | 03-agriculture-production.jpg | AGRICULTURE & PRODUCTION | field / agriculture / food production | https://unsplash.com/photos/farmer-tending-crops-under-an-umbrella-in-a-field-CNmwdjO06oo |
          | 04-energy-infrastructure.jpg | ENERGY & INFRASTRUCTURE | solar generation / infrastructure | https://unsplash.com/photos/solar-panels-generate-renewable-energy-in-a-field-svDLC_iZfGw |
          | 05-education-training.jpg | EDUCATION & TRAINING HUB | learning / workshop / professional development | https://unsplash.com/photos/audience-watching-a-presentation-in-a-conference-hall-ni_rnT7obJg |
          | 06-health-wellness.jpg | HEALTH & WELLNESS | wellness / physical wellbeing | https://unsplash.com/photos/woman-performing-a-yoga-pose-on-a-mat-TLiGUOMLIiU |
          | 07-sports-active.jpg | SPORTS & ACTIVE LIFESTYLE | training / sport / focus | https://unsplash.com/photos/a-female-runner-in-starting-blocks-at-a-race-OtJnvB027vo |
          | 08-service-hub.jpg | SERVICE HUB | service / customer interaction | https://unsplash.com/photos/reception-area |
          | 09-digital-business.jpg | DIGITAL BUSINESS | technology / teamwork / digital workspace | https://unsplash.com/photos/woman-talking-on-phone-at-desk-with-laptop-QzY81G7dbOo |
          | 10-custom-project.jpg | CUSTOM PROJECT | strategy / direction / decision making | https://unsplash.com/photos/wooden-figures-surround-a-green-compass-on-a-green-surface-sb3fQ3uIXfw |
          
          Licensing: all selected Unsplash source pages were marked free to use under the Unsplash License at selection time.
          EOF
          cat > "MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/photos/hero/SOURCES.md" <<'EOF'
          # MMW-COMPANY — hero media register

          | File | Role | Source |
          |---|---|---|
          | project-development-method.jpg | Hero visual: project development as a structured decision and planning process | https://unsplash.com/photos/woman-drawing-a-flowchart-on-a-whiteboard-46G4xEr122c |

          Licensing: the selected Unsplash source page was marked free to use under the Unsplash License at selection time.
          EOF

      - name: Validate HTML, JS and local media-only runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path("MMW-COMPANY/2 — WORKING/public/index.html").read_text(encoding="utf-8")
          assert s.count("<html")==1 and s.count("<head>")==1 and s.count("<body>")==1
          assert s.count("const CATALOG_MEDIA=")==1
          assert s.count('class="cardMedia"')>=1
          assert "/ASSETS/MMW-COMPANY/photos/hero/project-development-method.jpg" in s
          assert "images.unsplash.com" not in s and "images.pexels.com" not in s
          assert "http://" not in s and "https://" not in s
          print("Contextual media wiring validated.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path("MMW-COMPANY/2 — WORKING/public/index.html").read_text(encoding="utf-8")
          a=s.index("<script>"); b=s.index("</script>",a)
          Path("/tmp/mmw-company-script.js").write_text(s[a+8:b],encoding="utf-8")
          PY
          node --check /tmp/mmw-company-script.js

      - name: Commit imported contextual media
        shell: bash
        run: |
          git config user.name "MMW-COMPANY Factory"
          git config user.email "itimchenko00-hash@users.noreply.github.com"
          git add "MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/photos" "MMW-COMPANY/2 — WORKING/public/index.html"
          git commit -m "MMW-COMPANY: add semantic catalog and hero photography"
          git push
