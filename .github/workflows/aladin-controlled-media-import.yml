name: ALADIN Controlled Media Import

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05
    paths:
      - 'MMW-COMPANY/2 — WORKING/public/ASSETS/ALADIN/photos/web-selected/IMPORT-MANIFEST.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Controlled download of manifest assets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('MMW-COMPANY/2 — WORKING/public/ASSETS/ALADIN/photos/web-selected')
          manifest = json.loads((root/'IMPORT-MANIFEST.json').read_text(encoding='utf-8'))
          for item in manifest:
              out = root / item['file']
              out.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  'curl','-L','--fail','--retry','3','--retry-delay','2',
                  '-A','MMW-COMPANY/FACTORY controlled media import',
                  item['download_url'],'-o',str(out)
              ], check=True)
              if out.stat().st_size < 10000:
                  raise SystemExit(f'Asset too small: {out}')
          print(f"Imported {len(manifest)} controlled assets.")
          PY

      - name: Write provenance register
        shell: bash
        run: |
          python3 <<'PY'
          import json, pathlib
          from datetime import date
          root = pathlib.Path('MMW-COMPANY/2 — WORKING/public/ASSETS/ALADIN/photos/web-selected')
          manifest = json.loads((root/'IMPORT-MANIFEST.json').read_text(encoding='utf-8'))
          lines = [
            '# ALADIN RESIDENCE — Web-selected photo sources',
            '',
            'Controlled import register. Production runtime uses local repository assets only; no external image URL is required at runtime.',
            '',
            f'Import date: {date.today().isoformat()}',
            '',
            '| File | Pexels source | Photographer | Semantic placement | Rights note |',
            '|---|---|---|---|---|'
          ]
          for x in manifest:
              lines.append(f"| {x['file']} | {x['source_url']} | {x['author']} | {x['purpose']} | Pexels Free / verify depicted-person or trademark rights where applicable; no endorsement implied. |")
          (root/'SOURCES.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Validate and commit controlled import
        shell: bash
        run: |
          set -euo pipefail
          ROOT='MMW-COMPANY/2 — WORKING/public/ASSETS/ALADIN/photos/web-selected'
          python3 - <<'PY'
          import pathlib, json, hashlib
          root=pathlib.Path('MMW-COMPANY/2 — WORKING/public/ASSETS/ALADIN/photos/web-selected')
          items=json.loads((root/'IMPORT-MANIFEST.json').read_text())
          seen=set()
          for x in items:
              p=root/x['file']
              data=p.read_bytes()
              if len(data)<10000: raise SystemExit(f'small asset: {p}')
              h=hashlib.sha256(data).hexdigest()
              if h in seen: raise SystemExit(f'duplicate asset bytes: {p}')
              seen.add(h)
          print(f'G3 import validation passed for {len(items)} assets; unique SHA-256 values: {len(seen)}')
          PY
          git config user.name 'MMW-COMPANY Factory'
          git config user.email 'itimchenko00-hash@users.noreply.github.com'
          git add "$ROOT"/*.jpg "$ROOT"/SOURCES.md
          git commit -m 'ALADIN: import controlled web-selected photo assets'
          git push
