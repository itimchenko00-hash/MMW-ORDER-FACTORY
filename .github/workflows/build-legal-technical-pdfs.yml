name: Build legal and technical project PDFs

on:
  push:
    paths:
      - 'FACTORY-LEGAL-TECHNICAL-PACK-2026-09-08/**'
      - '.github/workflows/build-legal-technical-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdfs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ReportLab
        run: python -m pip install reportlab

      - name: Generate PDFs
        working-directory: FACTORY-LEGAL-TECHNICAL-PACK-2026-09-08
        run: python generate_pdfs.py

      - name: Commit generated PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FACTORY-LEGAL-TECHNICAL-PACK-2026-09-08/PDF FACTORY-LEGAL-TECHNICAL-PACK-2026-09-08/INDEX
          git diff --cached --quiet || git commit -m 'FACTORY: generate legal and technical project PDFs'
          git push