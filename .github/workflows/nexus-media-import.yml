name: NEXUS WORK media import

on:
  push:
    branches:
      - NEXUS-WORK-SNAPSHOT-2026-10-04

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: NEXUS-WORK-SNAPSHOT-2026-10-04

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check -q pillow

      - name: Download selected licensed references
        run: |
          set -euo pipefail
          mkdir -p ASSETS/NEXUS-WORK/photos
          find ASSETS/NEXUS-WORK/photos -maxdepth 1 -type f -name "*.jpg" -delete
          curl -L --fail --retry 3 -o /tmp/01.jpg 'https://images.unsplash.com/photo-1758691736933-bb0f88fe2e0c?auto=format&fit=max&w=2200&q=84'
          curl -L --fail --retry 3 -o /tmp/02.jpg 'https://images.pexels.com/photos/7854200/pexels-photo-7854200.jpeg?auto=compress&cs=tinysrgb&w=2200'
          curl -L --fail --retry 3 -o /tmp/03.jpg 'https://images.pexels.com/photos/28683745/pexels-photo-28683745.jpeg?auto=compress&cs=tinysrgb&w=2200'
          curl -L --fail --retry 3 -o /tmp/04.jpg 'https://images.pexels.com/photos/35856472/pexels-photo-35856472.jpeg?auto=compress&cs=tinysrgb&w=2200'
          curl -L --fail --retry 3 -o /tmp/05.jpg 'https://images.pexels.com/photos/18999475/pexels-photo-18999475.jpeg?auto=compress&cs=tinysrgb&w=2200'
          curl -L --fail --retry 3 -o /tmp/06.jpg 'https://images.unsplash.com/photo-1765371512971-9d4da531d004?auto=format&fit=max&w=2200&q=84'
          curl -L --fail --retry 3 -o /tmp/07.jpg 'https://images.pexels.com/photos/34823910/pexels-photo-34823910.jpeg?auto=compress&cs=tinysrgb&w=2200'
          curl -L --fail --retry 3 -o /tmp/08.jpg 'https://images.pexels.com/photos/26966416/pexels-photo-26966416.jpeg?auto=compress&cs=tinysrgb&w=2200'
          curl -L --fail --retry 3 -o /tmp/09.jpg 'https://images.pexels.com/photos/8297848/pexels-photo-8297848.jpeg?auto=compress&cs=tinysrgb&w=2200'

      - name: Normalize local media
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          names=[
            "01-hero-business-hub.jpg",
            "02-workspace-coworking.jpg",
            "03-business-community.jpg",
            "04-business-location.jpg",
            "05-training-learning.jpg",
            "06-economic-workspace.jpg",
            "07-premium-office.jpg",
            "08-networking-hub.jpg",
            "09-teamwork-office.jpg",
          ]
          for i,name in enumerate(names,1):
              src=Path(f"/tmp/{i:02d}.jpg")
              im=Image.open(src).convert("RGB")
              im.thumbnail((1800,1800),Image.Resampling.LANCZOS)
              im.save(Path("ASSETS/NEXUS-WORK/photos")/name,"JPEG",quality=84,optimize=True)
          PY

      - name: Replace NEXUS media mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("public/app.js")
          s=p.read_text()
          media=[
            "/ASSETS/NEXUS-WORK/photos/01-hero-business-hub.jpg",
            "/ASSETS/NEXUS-WORK/photos/02-workspace-coworking.jpg",
            "/ASSETS/NEXUS-WORK/photos/03-business-community.jpg",
            "/ASSETS/NEXUS-WORK/photos/04-business-location.jpg",
            "/ASSETS/NEXUS-WORK/photos/05-training-learning.jpg",
            "/ASSETS/NEXUS-WORK/photos/06-economic-workspace.jpg",
            "/ASSETS/NEXUS-WORK/photos/07-premium-office.jpg",
            "/ASSETS/NEXUS-WORK/photos/08-networking-hub.jpg",
            "/ASSETS/NEXUS-WORK/photos/09-teamwork-office.jpg",
          ]
          replacement="media:"+repr(media).replace("'","\"")
          pattern=r'("nexus-work":\{.*?\bmedia:)\[\],'
          s,n=re.subn(pattern, lambda m:m.group(1)+str(media).replace("'",'"'), s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit("NEXUS media mapping was not found exactly once")
          p.write_text(s)
          PY

      - name: Verify media uniqueness and local-only references
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          files=sorted(Path("ASSETS/NEXUS-WORK/photos").glob("*.jpg"))
          if len(files)!=9:
              raise SystemExit(f"Expected 9 NEXUS photos, found {len(files)}")
          hashes=[hashlib.sha256(f.read_bytes()).hexdigest() for f in files]
          if len(set(hashes))!=9:
              raise SystemExit("Duplicate NEXUS photo bytes detected")
          app=Path("public/app.js").read_text()
          if "https://images." in app or "http://images." in app:
              raise SystemExit("External image URL leaked into public app.js")
          print("NEXUS media: 9 local unique files; no external image URLs in app.js")
          PY

      - name: Commit imported media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/nexus-media-import.yml
          git add ASSETS/NEXUS-WORK/photos public/app.js .github/workflows/nexus-media-import.yml
          git commit -m 'NEXUS WORK: import unique semantic local media'
          git push origin HEAD:NEXUS-WORK-SNAPSHOT-2026-10-04
