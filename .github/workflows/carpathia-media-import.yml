name: CARPATHIA media import

on:
  push:
    branches:
      - MMW-COMPANY-FROM-SCRATCH-2026-10-03
    paths-ignore:
      - "ASSETS/CARPATHIA/photos/**"
      - ".github/workflows/carpathia-media-import.yml"
      - ".carpathia-media-import-trigger"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-FROM-SCRATCH-2026-10-03
          fetch-depth: 1

      - name: Download and normalize approved CARPATHIA sources
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          mkdir -p ASSETS/CARPATHIA/photos .carpathia-source
          curl -fL --retry 3 --retry-all-errors "https://images.unsplash.com/photo-1632919285427-21da9c5f006b?auto=format&fit=crop&fm=jpg&q=85&w=2400" -o .carpathia-source/01-territory
          curl -fL --retry 3 --retry-all-errors "https://images.unsplash.com/photo-1747947898302-5129283b401a?auto=format&fit=crop&fm=jpg&q=85&w=2400" -o .carpathia-source/02-stay
          curl -fL --retry 3 --retry-all-errors "https://images.unsplash.com/photo-1616426076848-9b40633b7f39?auto=format&fit=crop&fm=jpg&q=85&w=2400" -o .carpathia-source/03-nature
          curl -fL --retry 3 --retry-all-errors "https://images.unsplash.com/photo-1660213372472-766becf7427f?fm=jpg&q=85&w=2400" -o .carpathia-source/04-food
          curl -fL --retry 3 --retry-all-errors "https://images.unsplash.com/photo-1694432586555-9a6dfe443600?auto=format&fit=crop&fm=jpg&q=85&w=2400" -o .carpathia-source/05-experience
          curl -fL --retry 3 --retry-all-errors "https://images.unsplash.com/photo-1730292423302-6dd52ef35661?auto=format&fit=crop&fm=jpg&q=85&w=2400" -o .carpathia-source/06-guest
          curl -fL --retry 3 --retry-all-errors "https://images.unsplash.com/photo-1747948543506-c2a2abfaaccb?auto=format&fit=crop&fm=jpg&q=85&w=2400" -o .carpathia-source/07-service
          curl -fL --retry 3 --retry-all-errors "https://images.unsplash.com/photo-1660297423136-44b4c48c3c89?auto=format&fit=crop&fm=jpg&q=85&w=2400" -o .carpathia-source/08-model
          for n in 01-territory 02-stay 03-nature 04-food 05-experience 06-guest 07-service 08-model; do
            ffmpeg -y -loglevel error -i ".carpathia-source/$n" -frames:v 1 -q:v 2 "ASSETS/CARPATHIA/photos/$n.jpg"
          done

      - name: Validate normalized assets
        shell: bash
        run: |
          set -euo pipefail
          files=(ASSETS/CARPATHIA/photos/*.jpg)
          test "${#files[@]}" -eq 8
          for f in "${files[@]}"; do
            test "$(stat -c%s "$f")" -gt 10000
            test "$(xxd -p -l 3 "$f")" = "ffd8ff"
          done
          test "$(sha256sum "${files[@]}" | awk '{print $1}' | sort -u | wc -l)" -eq 8
          sha256sum "${files[@]}"

      - name: Commit assets and remove temporary importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "itimchenko00-hash"
          git config user.email "itimchenko00@gmail.com"
          rm -rf .carpathia-source .github/workflows/carpathia-media-import.yml .carpathia-media-import-trigger
          git add ASSETS/CARPATHIA/photos .github/workflows/carpathia-media-import.yml .carpathia-media-import-trigger
          git commit -m "CARPATHIA: import approved semantic project media"
          git push origin HEAD:MMW-COMPANY-FROM-SCRATCH-2026-10-03
