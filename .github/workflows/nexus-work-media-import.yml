name: NEXUS WORK controlled media import

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05

permissions:
  contents: write

jobs:
  import-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 0

      - name: Import approved Pexels assets
        shell: bash
        run: |
          set -euo pipefail
          dir="public/ASSETS/NEXUS-WORK/photos/web-selected"
          mkdir -p "$dir"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          declare -A urls
          urls["01-hero-workspace.jpg"]="https://images.pexels.com/photos/8606292/pexels-photo-8606292.jpeg?cs=srgb&dl=pexels-ryanpilat1-8606292.jpg&fm=jpg"
          urls["02-flex-workspace.jpg"]="https://images.pexels.com/photos/26966417/pexels-photo-26966417.jpeg?cs=srgb&dl=pexels-nicolas-rueda-175965148-26966417.jpg&fm=jpg"
          urls["03-collaboration.jpg"]="https://images.pexels.com/photos/12903182/pexels-photo-12903182.jpeg?cs=srgb&dl=pexels-mizunokozuki-12903182.jpg&fm=jpg"
          urls["04-meeting-room.jpg"]="https://images.pexels.com/photos/31709064/pexels-photo-31709064.jpeg?cs=srgb&dl=pexels-misbaa-eri-426041722-31709064.jpg&fm=jpg"
          urls["05-training.jpg"]="https://images.pexels.com/photos/18999475/pexels-photo-18999475.jpeg?cs=srgb&dl=pexels-bertellifotografia-18999475.jpg&fm=jpg"
          urls["06-business-exterior.jpg"]="https://images.pexels.com/photos/4889301/pexels-photo-4889301.jpeg?cs=srgb&dl=pexels-introspectivedsgn-4889301.jpg&fm=jpg"
          urls["07-networking.jpg"]="https://images.pexels.com/photos/8761555/pexels-photo-8761555.jpeg?cs=srgb&dl=pexels-pavel-danilyuk-8761555.jpg&fm=jpg"
          urls["08-presentation.jpg"]="https://images.pexels.com/photos/30319116/pexels-photo-30319116.jpeg?cs=srgb&dl=pexels-mehmet-balci-166052147-30319116.jpg&fm=jpg"
          urls["09-project-team.jpg"]="https://images.pexels.com/photos/5466236/pexels-photo-5466236.jpeg?cs=srgb&dl=pexels-shkrabaanthony-5466236.jpg&fm=jpg"

          for file in "${!urls[@]}"; do
            curl -L --fail --retry 3 -A "MMW-COMPANY/2 controlled media import" "${urls[$file]}" -o "$tmp/$file"
            test "$(stat -c%s "$tmp/$file")" -ge 20000
            file "$tmp/$file" | grep -Eiq 'JPEG|PNG|Web/P'
          done

          find "$dir" -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -delete
          cp "$tmp"/* "$dir"/

      - name: Write provenance
        shell: bash
        run: |
          cat > public/ASSETS/NEXUS-WORK/photos/web-selected/SOURCES.md <<'EOF'
# NEXUS WORK — media provenance

Import method: WEB SOURCE → CONTROLLED IMPORT → LOCAL FACTORY ASSET → SEMANTIC PLACEMENT → PROVENANCE → QA → LIVE

All runtime references are local. Source photos are from Pexels and are used under the Pexels License.

| Asset | Meaning | Source |
|---|---|---|
| 01-hero-workspace.jpg | Hero / overall business-hub atmosphere | https://www.pexels.com/photo/modern-office-interior-8606292/ |
| 02-flex-workspace.jpg | Flexible workspace | https://www.pexels.com/photo/coworking-office-space-with-pc-room-26966417/ |
| 03-collaboration.jpg | Users and collaboration | https://www.pexels.com/photo/employees-working-together-in-coworking-office-12903182/ |
| 04-meeting-room.jpg | Meetings / business interaction | https://www.pexels.com/photo/modern-office-team-in-meeting-room-with-city-view-31709064/ |
| 05-training.jpg | Learning / training | https://www.pexels.com/photo/business-training-course-18999475/ |
| 06-business-exterior.jpg | Site / business-address context | https://www.pexels.com/photo/exterior-of-modern-office-building-4889301/ |
| 07-networking.jpg | Professional connections | https://www.pexels.com/photo/groups-of-people-talking-in-the-office-8761555/ |
| 08-presentation.jpg | Events / knowledge exchange | https://www.pexels.com/photo/business-presentation-in-modern-office-setting-30319116/ |
| 09-project-team.jpg | Project teams / delivery and growth | https://www.pexels.com/photo/office-team-looking-at-the-laptop-5466236/ |

Pexels permits free commercial use and does not require attribution; provenance is retained here for auditability.

QA: nine local image files, no external runtime image URLs, one-to-one semantic mapping.
EOF

      - name: Restore local media mapping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("public/app.js")
          s=p.read_text()
          start='media:[]'
          media='media:["/ASSETS/NEXUS-WORK/photos/web-selected/01-hero-workspace.jpg?v=20261007-nexus-clean1","/ASSETS/NEXUS-WORK/photos/web-selected/02-flex-workspace.jpg?v=20261007-nexus-clean1","/ASSETS/NEXUS-WORK/photos/web-selected/03-collaboration.jpg?v=20261007-nexus-clean1","/ASSETS/NEXUS-WORK/photos/web-selected/04-meeting-room.jpg?v=20261007-nexus-clean1","/ASSETS/NEXUS-WORK/photos/web-selected/05-training.jpg?v=20261007-nexus-clean1","/ASSETS/NEXUS-WORK/photos/web-selected/06-business-exterior.jpg?v=20261007-nexus-clean1","/ASSETS/NEXUS-WORK/photos/web-selected/07-networking.jpg?v=20261007-nexus-clean1","/ASSETS/NEXUS-WORK/photos/web-selected/08-presentation.jpg?v=20261007-nexus-clean1","/ASSETS/NEXUS-WORK/photos/web-selected/09-project-team.jpg?v=20261007-nexus-clean1"]'
          if start not in s:
              raise SystemExit("Expected clean media placeholder not found")
          p.write_text(s.replace(start,media,1))
          PY

      - name: Commit controlled import
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ASSETS/NEXUS-WORK/photos/web-selected public/app.js
          git commit -m "Import NEXUS WORK media from approved web sources" || exit 0
          git push origin MMW-COMPANY-WORKSPACE-V1-2026-10-05
