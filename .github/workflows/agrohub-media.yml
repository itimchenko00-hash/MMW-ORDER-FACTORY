name: AGROHUB media acquisition

on:
  push:
    branches:
      - MMW-COMPANY-FROM-SCRATCH-2026-10-03
    paths-ignore:
      - "public/ASSETS/AGROHUB/photos/web-selected/**"

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved Pexels originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/ASSETS/AGROHUB/photos/web-selected
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/2451421/pexels-photo-2451421.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-2451421.jpg&fm=jpg" -o public/ASSETS/AGROHUB/photos/web-selected/01-hero.jpg
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/2965707/pexels-photo-2965707.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-2965707.jpg&fm=jpg" -o public/ASSETS/AGROHUB/photos/web-selected/02-receiving.jpg
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/36181870/pexels-photo-36181870.jpeg?cs=srgb&dl=pexels-mrgajowy3-teodor-2158318376-36181870.jpg&fm=jpg" -o public/ASSETS/AGROHUB/photos/web-selected/03-storage.jpg
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/11679685/pexels-photo-11679685.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-11679685.jpg&fm=jpg" -o public/ASSETS/AGROHUB/photos/web-selected/04-drying.jpg
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/2889193/pexels-photo-2889193.jpeg?cs=srgb&dl=pexels-nc-farm-bureau-mark-2889193.jpg&fm=jpg" -o public/ASSETS/AGROHUB/photos/web-selected/05-processing.jpg
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/13795516/pexels-photo-13795516.jpeg?cs=srgb&dl=pexels-monica-gaitan-326725449-13795516.jpg&fm=jpg" -o public/ASSETS/AGROHUB/photos/web-selected/06-packaging.jpg
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/5953713/pexels-photo-5953713.jpeg?cs=srgb&dl=pexels-shvetsa-5953713.jpg&fm=jpg" -o public/ASSETS/AGROHUB/photos/web-selected/07-cold-storage.jpg
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/34585120/pexels-photo-34585120.jpeg?cs=srgb&dl=pexels-caleboquendo-34585120.jpg&fm=jpg" -o public/ASSETS/AGROHUB/photos/web-selected/08-logistics.jpg
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/19500302/pexels-photo-19500302.jpeg?cs=srgb&dl=pexels-fabrizio-zini-606841368-19500302.jpg&fm=jpg" -o public/ASSETS/AGROHUB/photos/web-selected/09-export.jpg
      - name: Write provenance registry
        shell: bash
        run: |
          cat > public/ASSETS/AGROHUB/photos/web-selected/SOURCES.md <<'EOF'
          # AGROHUB — semantic photo registry

          Runtime uses only local JPG copies in this directory. Source URLs are provenance records, never runtime image URLs.

          | Local asset | Semantic role | Source |
          |---|---|---|
          | 01-hero.jpg | AGROHUB infrastructure / master view | https://www.pexels.com/photo/modern-farm-complex-storing-of-grains-2451421/ |
          | 02-receiving.jpg | Raw-material receiving | https://www.pexels.com/photo/a-truck-dumping-grains-for-storing-2965707/ |
          | 03-storage.jpg | Grain storage | https://www.pexels.com/photo/industrial-grain-silos-against-blue-sky-36181870/ |
          | 04-drying.jpg | Post-harvest preparation / sorting line | https://www.pexels.com/photo/coffee-beans-in-a-factory-11679685/ |
          | 05-processing.jpg | Processing line | https://www.pexels.com/photo/processing-of-potatoes-in-a-factory-2889193/ |
          | 06-packaging.jpg | Product bagging / packaging | https://www.pexels.com/photo/man-packing-food-into-large-bags-13795516/ |
          | 07-cold-storage.jpg | Controlled cold storage | https://www.pexels.com/photo/a-worker-in-a-storage-room-5953713/ |
          | 08-logistics.jpg | Warehouse logistics / loading | https://www.pexels.com/photo/forklift-operators-loading-pallets-on-truck-34585120/ |
          | 09-export.jpg | Export / outbound market | https://www.pexels.com/photo/ship-on-a-sea-19500302/ |

          All selected sources are marked Free to use on Pexels at the time of selection. Images are stored locally before entering the public runtime.
          EOF
      - name: Commit local media
        shell: bash
        run: |
          git config user.name "MMW-COMPANY media pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add public/ASSETS/AGROHUB/photos/web-selected
          if git diff --cached --quiet; then
            echo "No media changes."
          else
            git commit -m "media: add clean semantic AGROHUB photo set"
            git push
          fi
