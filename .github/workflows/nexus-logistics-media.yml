name: NEXUS LOGISTICS media import
# Controlled import: local copies only, no runtime external media.

on:
  push:
    branches:
      - MMW-COMPANY-FROM-SCRATCH-2026-10-03
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project media folder
        run: mkdir -p public/ASSETS/NEXUS-LOGISTICS/photos/web-selected
\n      - name: Prepare ENERGY PARK media folder\n        run: mkdir -p public/ASSETS/ENERGY-PARK/photos/web-selected\n
      - name: Download selected free-to-use photos
        shell: bash
        run: |
          set -euo pipefail
          base="public/ASSETS/NEXUS-LOGISTICS/photos/web-selected"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1763143597839-1b94bf8f5bf9?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/21-hero.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1774929107410-9cb5fb83fea6?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/01-flow.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1721937127582-ed331de95a04?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/02-storage.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1741707041743-534a6d3307cb?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/03-handling.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1759272548470-d0686d071036?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/04-transport.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1774929107123-dd8309c1c645?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/05-operator.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1764046155497-ad7e50737ffa?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/06-economics.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1672552226380-486fe900b322?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/07-warehouse.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1779517226032-e78b30bda468?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/08-crossdock.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1772920908589-d6264e5d987f?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/09-fulfillment.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1627915589334-14a3c3e3a741?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/10-service.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1773125929765-99d4d67e831d?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/11-risk-flow.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1778015862504-b877b548266e?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/12-risk-access.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1697057914230-320d7c251f65?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/13-risk-loading.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1772300164438-f73307d3b645?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/14-risk-operations.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1778015855284-1b0c89c31867?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/15-risk-concentration.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1717386255767-52643970d483?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/16-market-manufacturers.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1764470738268-99e79e2c8b05?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/17-market-distributors.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1766871138969-510e404f1293?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/18-market-retail.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1770013413878-2530e2c3d82b?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/19-market-ecommerce.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1725781535657-29d825bc7824?auto=format&fit=crop&fm=jpg&q=82&w=2200" -o "$base/20-market-operators.jpg"

      - name: Download ENERGY PARK selected free-to-use photos
        shell: bash
        run: |
          set -euo pipefail
          base="public/ASSETS/ENERGY-PARK/photos/web-selected"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/35454191/pexels-photo-35454191.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/01-hero.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/33626643/pexels-photo-33626643.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/02-development.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/2802106/pexels-photo-2802106.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/03-infrastructure.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/34718926/pexels-photo-34718926.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/04-industry.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/35691079/pexels-photo-35691079.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/05-energy-contour.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/11032766/pexels-photo-11032766.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/06-grid.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/10879339/pexels-photo-10879339.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/07-economic-context.jpg"
          curl -fL --retry 3 --retry-delay 2 "https://images.pexels.com/photos/29923347/pexels-photo-29923347.jpeg?auto=compress&cs=tinysrgb&w=2200" -o "$base/08-international.jpg"

      - name: Validate ENERGY PARK media
        shell: bash
        run: |
          set -euo pipefail
          test "$(find public/ASSETS/ENERGY-PARK/photos/web-selected -maxdepth 1 -type f -name "*.jpg" | wc -l)" -eq 8
          for f in public/ASSETS/ENERGY-PARK/photos/web-selected/*.jpg; do
            test -s "$f"
            file "$f" | grep -Eiq 'JPEG|image'
          done

      - name: Record ENERGY PARK media provenance
        run: |
          cat > public/ASSETS/ENERGY-PARK/photos/web-selected/SOURCES.md <<'EOF'
          # ENERGY PARK — local web media

          Eight distinct local project assets selected from Pexels for the semantic roles below. Source pages are marked Free / Free to use on Pexels. Runtime uses only local copies.

          | File | Semantic role | Source |
          |---|---|---|
          | 01-hero.jpg | Industrial energy environment / hero | https://www.pexels.com/photo/aerial-view-of-industrial-complex-in-china-35454191/ |
          | 02-development.jpg | Industrial site / development context | https://www.pexels.com/photo/aerial-view-of-industrial-factory-complex-33626643/ |
          | 03-infrastructure.jpg | Transmission infrastructure | https://www.pexels.com/photo/transmission-tower-2802106/ |
          | 04-industry.jpg | Industrial users / production | https://www.pexels.com/photo/industrial-factory-interior-with-conveyor-belt-34718926/ |
          | 05-energy-contour.jpg | Solar / energy generation | https://www.pexels.com/photo/aerial-view-of-rooftop-solar-panel-installation-35691079/ |
          | 06-grid.jpg | Power network / connection | https://www.pexels.com/photo/transformer-on-a-transmission-tower-11032766/ |
          | 07-economic-context.jpg | Grid scale / infrastructure network | https://www.pexels.com/photo/power-lines-connected-by-electric-posts-10879339/ |
          | 08-international.jpg | Industrial park / international context | https://www.pexels.com/photo/aerial-view-of-modern-industrial-complex-with-solar-panels-29923347/ |
          EOF

      - name: Connect ENERGY PARK local media
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')
          marker='"energy-park":{'
          start=s.index(marker)
          m=s.index('media:[]',start)
          paths='media:["/ASSETS/ENERGY-PARK/photos/web-selected/01-hero.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/02-development.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/03-infrastructure.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/04-industry.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/05-energy-contour.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/06-grid.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/07-economic-context.jpg","/ASSETS/ENERGY-PARK/photos/web-selected/08-international.jpg"]'
          s=s[:m]+paths+s[m+8:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate local media
        shell: bash
        run: |
          set -euo pipefail
          for f in public/ASSETS/NEXUS-LOGISTICS/photos/web-selected/*.jpg; do
            test -s "$f"
            file "$f" | grep -Eiq 'JPEG|image'
          done
          test "$(find public/ASSETS/NEXUS-LOGISTICS/photos/web-selected -maxdepth 1 -type f -name "*.jpg" | wc -l)" -eq 21

      - name: Record media provenance
        run: |
          cat > public/ASSETS/NEXUS-LOGISTICS/photos/web-selected/SOURCES.md <<'EOF'
          # NEXUS LOGISTICS — local web media

          All twenty-one photos are locally committed project assets. The selected source pages were marked free to use under the Unsplash License at the time of selection. Runtime uses only these local copies; no external image URL is used by the project.

          | File | Semantic role | Source |
          |---|---|---|
          | 21-hero.jpg | Главный визуальный образ логистического узла | https://unsplash.com/photos/aerial-view-of-a-busy-port-with-ships-and-buildings-c7odDor0yy8 |
          | 01-flow.jpg | Товарный поток / грузовая связность | https://unsplash.com/photos/shipping-containers-stacked-at-a-busy-port-with-trucks-w0U2ckN9wig |
          | 02-storage.jpg | Складское хранение | https://unsplash.com/photos/a-warehouse-filled-with-lots-of-boxes-and-pallets-28b8xlTT5t4 |
          | 03-handling.jpg | Операционная обработка | https://unsplash.com/photos/workers-package-cardboard-boxes-in-a-warehouse-1ghTMoMU7-A |
          | 04-transport.jpg | Транспортная инфраструктура | https://unsplash.com/photos/shipping-containers-stacked-at-a-busy-port-with-cranes-Beg5nxwR9tA |
          | 05-operator.jpg | Операторская / транспортная эксплуатация | https://unsplash.com/photos/a-truck-carrying-a-large-shipping-container-at-a-port-9unRFufhNUw |
          | 06-economics.jpg | Погрузочная инфраструктура как физический актив | https://unsplash.com/photos/warehouse-loading-dock-with-stacked-wooden-pallets-EkhNNwpYuB4 |
          | 07-warehouse.jpg | Товарный запас / складская среда | https://unsplash.com/photos/a-warehouse-filled-with-lots-of-boxes-and-pallets-VnMbc9Szs-E |
          | 08-crossdock.jpg | Перегрузка и движение между входящим/исходящим транспортом | https://unsplash.com/photos/forklift-loading-blue-and-white-containers-into-a-delivery-truck-V-JzJ-1u3Gw |
          | 09-fulfillment.jpg | Упаковка / fulfillment | https://unsplash.com/photos/abstract-arrangement-of-layered-cardboard-pieces-fSDG3mTNCik |
          | 10-service.jpg | Сервисная складская инфраструктура | https://unsplash.com/photos/white-and-red-cardboard-boxes-on-shelf-CBTmEZqUaM0 |
          | 11-risk-flow.jpg | Устойчивость товарного запаса и риск концентрации потока | https://unsplash.com/photos/pile-of-cardboard-boxes-stacked-in-a-storage-area-RI_VrbUngcA |
          | 12-risk-access.jpg | Транспортная доступность и терминальная инфраструктура | https://unsplash.com/photos/truck-and-trailers-parked-in-front-of-a-warehouse-xkAIwD0hsbg |
          | 13-risk-loading.jpg | Погрузочная инфраструктура и фактическая операционная загрузка | https://unsplash.com/photos/a-yellow-shoprite-truck-backed-into-a-loading-dock-4io1vRG0s0w |
          | 14-risk-operations.jpg | Персонал и операционная среда | https://unsplash.com/photos/workers-in-a-large-empty-warehouse-with-polished-floors-vp0ffQcBqJ0 |
          | 15-risk-concentration.jpg | Концентрация транспортной мощности и клиентской базы | https://unsplash.com/photos/row-of-parked-semi-trailer-trucks-behind-a-fence-k0qruynLRt0 |
          | 16-market-manufacturers.jpg | Производственная линия и регулярный выпуск продукции | https://unsplash.com/photos/a-factory-with-a-lot-of-machines-in-it-5hPe-Tr2wog |
          | 17-market-distributors.jpg | Региональный склад и распределительная инфраструктура | https://unsplash.com/photos/industrial-warehouse-building-by-the-water-gwuOJT14oBw |
          | 18-market-retail.jpg | Товарный запас и торговая полка | https://unsplash.com/photos/aisle-of-a-well-stocked-retail-store-with-many-products-Y28cnKlML0U |
          | 19-market-ecommerce.jpg | Онлайн-торговля, заказ и подготовка отправления | https://unsplash.com/photos/woman-checking-package-with-phone-near-laptop-and-boxes-k63Or81F8-M |
          | 20-market-operators.jpg | Грузовой парк и операционная логистика | https://unsplash.com/photos/a-group-of-people-walking-around-a-building-FFaDpgMAJyA |

          Selection rule: one distinct local photo per visual role; no runtime external fallback; no reuse inside the NEXUS LOGISTICS visual set. Hero uses dedicated asset 21; logic uses 01–06; product uses 07–10; risk-control uses 11–15; market uses 16–20. Risk-control cards use dedicated local assets 11–15 and market cards use dedicated local assets 16–20; neither group reuses hero, logic, or product photos.
          EOF

      - name: Enable local media in project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("public/app.js")
          s=p.read_text()
          s=s.replace("const NEXUS_LOGISTICS_PHOTOS_READY=false;", "const NEXUS_LOGISTICS_PHOTOS_READY=true;")
          p.write_text(s)
          PY

      - name: Commit imported media
        run: |
          git config user.name "MMW-COMPANY Factory"
          git config user.email "itimchenko00-hash@users.noreply.github.com"
          git add public/ASSETS/NEXUS-LOGISTICS/photos/web-selected public/ASSETS/ENERGY-PARK/photos/web-selected public/app.js
          git diff --cached --quiet && exit 0
          git commit -m "NEXUS LOGISTICS: import selected media + ENERGY PARK local media"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

# Media import verified: local copies, semantic mapping, and provenance are mandatory.
