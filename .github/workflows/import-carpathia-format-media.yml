name: Import CARPATHIA format media

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05
    paths:
      - 'MMW-COMPANY/2 — WORKING/public/carpathia.html'

jobs:
  import:
    if: ${{ !startsWith(github.event.head_commit.message, 'CARPATHIA format media import') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download controlled local assets
        shell: bash
        run: |
          set -euo pipefail
          base='MMW-COMPANY/2 — WORKING/public/ASSETS/CARPATHIA/photos/web-selected/formats'
          mkdir -p "$base"
          declare -A urls
          urls[01-eco-lodge.jpg]='https://images.pexels.com/photos/38852783/pexels-photo-38852783.jpeg?auto=compress&cs=tinysrgb&w=1600'
          urls[02-family-lodge.jpg]='https://images.pexels.com/photos/9222068/pexels-photo-9222068.jpeg?auto=compress&cs=tinysrgb&w=1600'
          urls[03-wellness-retreat.jpg]='https://images.pexels.com/photos/19980238/pexels-photo-19980238.jpeg?auto=compress&cs=tinysrgb&w=1600'
          urls[04-mountain-workation.jpg]='https://images.pexels.com/photos/37593643/pexels-photo-37593643.jpeg?auto=compress&cs=tinysrgb&w=1600'
          urls[05-eco-resort.jpg]='https://images.pexels.com/photos/35831683/pexels-photo-35831683.jpeg?auto=compress&cs=tinysrgb&w=1600'
          urls[06-recovery-retreat.jpg]='https://images.pexels.com/photos/9985427/pexels-photo-9985427.jpeg?auto=compress&cs=tinysrgb&w=1600'
          for name in "${!urls[@]}"; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 "${urls[$name]}" -o "$base/$name"
            test -s "$base/$name"
            file "$base/$name"
          done
      - name: Write provenance
        shell: bash
        run: |
          set -euo pipefail
          base='MMW-COMPANY/2 — WORKING/public/ASSETS/CARPATHIA/photos/web-selected/formats'
          cat > "$base/SOURCES.md" <<'EOF'
# CARPATHIA — format media provenance

All six files below are imported as local binary assets. They are not runtime external image links.

| Local asset | Semantic role | Source | License/status |
|---|---|---|---|
| 01-eco-lodge.jpg | ECO LODGE — private nature lodging | https://www.pexels.com/photo/charming-rustic-cabin-amidst-lush-forest-38852783/ | Pexels · Free to use |
| 02-family-lodge.jpg | FAMILY LODGE — family stay in cabin/nature | https://www.pexels.com/photo/family-on-balcony-of-cabin-in-forest-9222068/ | Pexels · Free to use |
| 03-wellness-retreat.jpg | WELLNESS RETREAT — sauna/wellness setting | https://www.pexels.com/photo/interior-of-sauna-cabin-19980238/ | Pexels · Free to use |
| 04-mountain-workation.jpg | MOUNTAIN WORKATION — remote work with mountain context | https://www.pexels.com/photo/remote-work-desk-with-mountain-view-in-winter-37593643/ | Pexels · Free to use |
| 05-eco-resort.jpg | ECO RESORT — broader nature resort context | https://www.pexels.com/photo/aerial-view-of-eco-lodge-with-lush-greenery-35831683/ | Pexels · Free to use |
| 06-recovery-retreat.jpg | RECOVERY RETREAT — yoga/nature recovery | https://www.pexels.com/photo/woman-doing-yoga-in-forest-9985427/ | Pexels · Free to use |

## Selection rule
These assets are dedicated to the six format cards and are separate from the existing CARPATHIA media set. No external image URL is used at runtime.
EOF
          sha256sum "$base"/*.jpg > "$base/SHA256SUMS.txt"
      - name: Commit local assets and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MMW Media Import'
          git config user.email 'actions@users.noreply.github.com'
          git add 'MMW-COMPANY/2 — WORKING/public/ASSETS/CARPATHIA/photos/web-selected/formats'
          git commit -m 'CARPATHIA format media import: six local assets' || exit 0
          git push
