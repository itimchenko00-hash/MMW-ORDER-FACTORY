name: Factory semantic project media import
on:
  push:
    branches:
      - MMW-COMPANY-NEW-MASTER-2026-10-01
permissions:
  contents: write
jobs:
  import-project-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen Factory media importer
        run: node remaining-projects-media-download.js
      - name: Verify local media
        run: |
          set -euo pipefail
          test "$(find ASSETS/NEXUS-WORK/photos -type f -name '*.jpg' | wc -l)" -ge 6
          test "$(find ASSETS/AGROHUB/photos -type f -name '*.jpg' | wc -l)" -ge 6
          test "$(find ASSETS/ENERGY-PARK/photos -type f -name '*.jpg' | wc -l)" -ge 6
          test "$(find public/ASSETS/ALADIN/photos/web-selected -type f -name '*.jpg' | wc -l)" -ge 8
          test "$(find ASSETS/CARPATHIA/photos -type f -name '*.jpg' | wc -l)" -ge 8
      - name: Commit imported local media
        run: |
          set -euo pipefail
          git config user.name 'MMW Factory Bot'
          git config user.email 'itimchenko00@gmail.com'
          git add ASSETS/NEXUS-WORK/photos ASSETS/AGROHUB/photos ASSETS/ENERGY-PARK/photos ASSETS/CARPATHIA/photos public/ASSETS/ALADIN/photos/web-selected
          git diff --cached --quiet && exit 0
          git commit -m 'MMW-COMPANY: import semantic ALADIN web media and remaining project media'
          git push
