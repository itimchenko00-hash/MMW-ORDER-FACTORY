name: Import NEXUS WORK media

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05

permissions:
  contents: write

jobs:
  import-nexus-work-media:
    if: ${{ contains(github.event.head_commit.message, '[nexus-work-media-import]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate application syntax
        run: node --check public/app.js
      - name: Download approved project media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/ASSETS/NEXUS-WORK/photos/web-selected
          curl -L --fail --retry 3 "https://images.pexels.com/photos/26966417/pexels-photo-26966417.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/NEXUS-WORK/photos/web-selected/01-hero-business-hub.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/5506065/pexels-photo-5506065.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/NEXUS-WORK/photos/web-selected/02-workspace-coworking.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/8761555/pexels-photo-8761555.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/NEXUS-WORK/photos/web-selected/03-business-community.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/6510382/pexels-photo-6510382.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/NEXUS-WORK/photos/web-selected/04-business-location.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/9301152/pexels-photo-9301152.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/NEXUS-WORK/photos/web-selected/05-training-learning.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/37110055/pexels-photo-37110055.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/NEXUS-WORK/photos/web-selected/06-economic-workspace.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/8112140/pexels-photo-8112140.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/NEXUS-WORK/photos/web-selected/07-premium-office.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/8761647/pexels-photo-8761647.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/NEXUS-WORK/photos/web-selected/08-networking-hub.jpg
          curl -L --fail --retry 3 "https://images.pexels.com/photos/8068836/pexels-photo-8068836.jpeg?auto=compress&cs=tinysrgb&w=1600" -o public/ASSETS/NEXUS-WORK/photos/web-selected/09-teamwork-office.jpg
      - name: Write provenance
        shell: bash
        run: |
          cat > public/ASSETS/NEXUS-WORK/photos/web-selected/SOURCES.md <<'EOF'
          # NEXUS WORK — web-selected media provenance

          Import protocol: WEB SOURCE → CONTROLLED IMPORT → LOCAL FACTORY ASSET → SEMANTIC PLACEMENT → PROVENANCE → QA → LIVE.

          Source library: Pexels. Selected source pages are marked free to use / Free at import time. Final usage remains subject to the Pexels License.

          | File | Source | Author | Semantic role |
          |---|---|---|---|
          | 01-hero-business-hub.jpg | https://www.pexels.com/photo/coworking-office-space-with-pc-room-26966417/ | Nicolás Rueda | Hero: flexible business hub / coworking |
          | 02-workspace-coworking.jpg | https://www.pexels.com/photo/empty-office-space-5506065/ | Mike van Schoonderwalt | Workspace: everyday work environment |
          | 03-business-community.jpg | https://www.pexels.com/photo/groups-of-people-talking-in-the-office-8761555/ | Pavel Danilyuk | Community: professional networking |
          | 04-business-location.jpg | https://www.pexels.com/photo/contemporary-building-of-prosperous-business-center-6510382/ | Lachlan Ross | Location: business-center context |
          | 05-training-learning.jpg | https://www.pexels.com/photo/woman-giving-presentation-in-office-9301152/ | Mikhail Nilov | Training: learning and development |
          | 06-economic-workspace.jpg | https://www.pexels.com/photo/modern-office-interior-with-glass-desk-and-bookshelves-37110055/ | Century21 Lebanon | Economics: professional workspace / value of space |
          | 07-premium-office.jpg | https://www.pexels.com/photo/man-in-black-suit-sitting-at-his-office-8112140/ | Pavel Danilyuk | Premium: private professional office |
          | 08-networking-hub.jpg | https://www.pexels.com/photo/people-standing-at-the-table-8761647/ | Pavel Danilyuk | Networking: events and business connections |
          | 09-teamwork-office.jpg | https://www.pexels.com/photo/people-having-a-meeting-at-the-office-8068836/ | Edmond Dantès | Teamwork: collaboration and delivery |

          Import date: 2026-10-07.
          Runtime policy: no external image URLs; website references local /ASSETS/NEXUS-WORK/photos/web-selected/ files only.
          EOF
      - name: Verify local media integrity
        shell: bash
        run: |
          set -euo pipefail
          for f in 01-hero-business-hub.jpg 02-workspace-coworking.jpg 03-business-community.jpg 04-business-location.jpg 05-training-learning.jpg 06-economic-workspace.jpg 07-premium-office.jpg 08-networking-hub.jpg 09-teamwork-office.jpg; do
            test -s "public/ASSETS/NEXUS-WORK/photos/web-selected/$f"
            file "public/ASSETS/NEXUS-WORK/photos/web-selected/$f" | grep -Ei 'JPEG image|JPG image'
          done
      - name: Reconnect local media in app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("public/app.js")
          s=p.read_text(encoding="utf-8")
          start=s.index('"nexus-work":{')
          end=s.index('sections:', start)
          block=s[start:end]
          local='media:["/ASSETS/NEXUS-WORK/photos/web-selected/01-hero-business-hub.jpg","/ASSETS/NEXUS-WORK/photos/web-selected/02-workspace-coworking.jpg","/ASSETS/NEXUS-WORK/photos/web-selected/03-business-community.jpg","/ASSETS/NEXUS-WORK/photos/web-selected/04-business-location.jpg","/ASSETS/NEXUS-WORK/photos/web-selected/05-training-learning.jpg","/ASSETS/NEXUS-WORK/photos/web-selected/06-economic-workspace.jpg","/ASSETS/NEXUS-WORK/photos/web-selected/07-premium-office.jpg","/ASSETS/NEXUS-WORK/photos/web-selected/08-networking-hub.jpg","/ASSETS/NEXUS-WORK/photos/web-selected/09-teamwork-office.jpg"],'
          block=re.sub(r'media:\[[^\]]*\],',local,block,count=1)
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding="utf-8")
          PY
          node --check public/app.js
      - name: Commit imported media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ASSETS/NEXUS-WORK/photos/web-selected public/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "NEXUS WORK: controlled web media import"
          git push
