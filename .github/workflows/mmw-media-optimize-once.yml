name: MMW Media Optimization (one-time)

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05

permissions:
  contents: write

jobs:
  optimize:
    if: contains(github.event.head_commit.message, 'MMW Media Optimization (one-time)') == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Optimize local JPEG assets
        shell: bash
        run: |
          set -euo pipefail
          root='MMW-COMPANY/2 — WORKING/public/ASSETS'
          echo "Before:"
          find "$root" -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -size +1M -printf '%s %p\n' | sort -nr | head -80 || true

          while IFS= read -r -d '' file; do
            tmp="${file}.optimized.jpg"
            convert "$file" -auto-orient -resize '2400x2400>' -strip -interlace Plane -sampling-factor 4:2:0 -quality 82 "$tmp"
            old=$(stat -c%s "$file")
            new=$(stat -c%s "$tmp")
            if [ "$new" -lt "$old" ]; then
              mv "$tmp" "$file"
            else
              rm -f "$tmp"
            fi
          done < <(find "$root" -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -size +1M -print0)

          echo "After:"
          find "$root" -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -printf '%s %p\n' | sort -nr | head -80

      - name: Commit optimized assets and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MMW Factory'
          git config user.email 'itimchenko00@gmail.com'
          git add 'MMW-COMPANY/2 — WORKING/public/ASSETS'
          git rm -f '.github/workflows/mmw-media-optimize-once.yml'
          if git diff --cached --quiet; then
            echo 'No optimization changes required.'
            exit 0
          fi
          git commit -m 'MMW Media Optimization (one-time)'
          git push origin HEAD:${GITHUB_REF_NAME}
