name: Persist ALADIN project photography

on:
  push:
    branches:
      - MMW-COMPANY-FROM-SCRATCH-2026-10-03
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-FROM-SCRATCH-2026-10-03

      - name: Download ALADIN photography into project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/aladin/process-media

          download_unsplash() {
            local photo_id="$1"
            local output="$2"
            local meta="/tmp/unsplash-${photo_id}.json"
            curl -fsSL --retry 5 --retry-all-errors -A "Mozilla/5.0" "https://unsplash.com/napi/photos/${photo_id}" -o "$meta"
            local image_url
            image_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["urls"]["full"])' "$meta")"
            test -n "$image_url"
            curl -fsSL --retry 5 --retry-all-errors -A "Mozilla/5.0" "$image_url" -o "$output"
          }

          download_unsplash "l2_XkKXObm0" public/assets/aladin/process-media/01-research.jpg
          download_unsplash "4ZuD2HzSGi0" public/assets/aladin/process-media/02-architecture.jpg
          download_unsplash "jkO_wMw4168" public/assets/aladin/process-media/03-economy.webp
          download_unsplash "fNxmdlYHRm8" public/assets/aladin/process-media/04-design.jpg
          curl -fsSL --retry 5 --retry-all-errors -A "Mozilla/5.0" "https://cmsplatform.blob.core.windows.net/wwwkvnconstructioncom/blog-images/4db336bf-f1db-449f-9b6d-a35226bf6966.jpg" -o public/assets/aladin/process-media/05-preparation.jpg
          download_unsplash "siRa_Kl2fBM" public/assets/aladin/process-media/06-construction.jpg
          download_unsplash "D2_6WTd5z3U" public/assets/aladin/process-media/07-sales.jpg
          download_unsplash "098sYCTeyCc" public/assets/aladin/process-media/08-management.jpg

          for f in public/assets/aladin/process-media/*; do
            test -s "$f"
            case "$(file -b --mime-type "$f")" in image/*) ;; *) echo "Not an image: $f"; exit 1;; esac
          done

          file public/assets/aladin/process-media/*

      - name: Normalize process asset extension
        shell: bash
        run: |
          set -euo pipefail
          mv public/assets/aladin/process-media/03-economy.webp public/assets/aladin/process-media/03-economy.jpg

      - name: Commit project assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MMW-COMPANY"
          git config user.email "itimchenko00@gmail.com"
          git add public/assets/aladin/process-media
          git diff --cached --quiet && exit 0
          git commit -m "ALADIN: persist process photography in project assets"
          git push origin HEAD:MMW-COMPANY-FROM-SCRATCH-2026-10-03
