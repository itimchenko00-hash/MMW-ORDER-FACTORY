name: ETALON 03 project visual languages
on:
  push:
    branches: ['ЭТАЛОН-03/MMW-COMPANY-WORK']
permissions:
  contents: write
jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject project-specific visual language
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('ЭТАЛОН-03/MMW-COMPANY/site/projects')
          styles={
          'ALADIN.html':'''<style data-etalon03-project-style="ALADIN">:root{--project-radius:12px}body{background:radial-gradient(circle at 78% 10%,rgba(217,185,138,.10),transparent 34%),linear-gradient(180deg,var(--bg),var(--panel) 48%,var(--bg))!important}.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.8%,rgba(217,185,138,.18) 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,rgba(217,185,138,.12) 50%,transparent 50.2%);background-size:84px 84px;mask-image:linear-gradient(to top,rgba(0,0,0,.8),transparent 78%)}.hero .wrap{position:relative;z-index:1}.hero h1,.head h2{font-family:Georgia,'Times New Roman',serif;letter-spacing:-.025em}.card,.stage,.metric,.node{border-radius:var(--project-radius)!important;box-shadow:inset 0 1px 0 rgba(240,211,164,.05)}.card{background:linear-gradient(145deg,#211b14,#12100d)!important}.visual,.product img{border-radius:9px!important}.metric{border-top-width:1px!important;border-left:2px solid var(--project-primary)!important}.node{border-radius:7px!important}.primary{border-radius:7px!important;box-shadow:0 8px 28px rgba(217,185,138,.12)}.card:hover{transform:translateY(-2px);transition:.22s ease;border-color:var(--project-primary)!important}.head{border-left:2px solid var(--project-primary);padding-left:16px}</style>''',
          'NEXUS WORK.html':'''<style data-etalon03-project-style="NEXUS-WORK">body{background:radial-gradient(circle at 80% 0,rgba(92,141,255,.14),transparent 32%),linear-gradient(180deg,var(--bg),#0c1422 52%,var(--bg))!important}.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(115,167,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(115,167,255,.09) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.8),transparent 78%)}.hero .wrap{position:relative;z-index:1}.hero h1,.head h2{font-family:Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-.045em}.card,.stage,.metric,.node{border-radius:7px!important;background:linear-gradient(145deg,#121d30,#0b1220)!important}.card{position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;width:28px;height:2px;background:var(--project-primary);opacity:.75}.metric{border-top:0!important;border-left:2px solid var(--project-primary)!important}.node{border-radius:5px!important}.primary{border-radius:5px!important;box-shadow:0 0 26px rgba(92,141,255,.14)}.card:hover,.node:hover{transform:translateY(-2px);transition:.18s ease;border-color:var(--project-primary)!important;box-shadow:0 0 24px rgba(92,141,255,.08)}.head{border-bottom:1px solid var(--line);padding-bottom:10px}.eyebrow{font-family:'SFMono-Regular',Consolas,monospace;letter-spacing:.24em!important}</style>''',
          'NEXUS LOGISTICS.html':'''<style data-etalon03-project-style="NEXUS-LOGISTICS">body{background:linear-gradient(180deg,#0b1014,#101920 50%,#090e12)!important}.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 35px,rgba(138,169,189,.07) 36px),linear-gradient(90deg,transparent 0 24%,rgba(185,207,219,.08) 24.1% 24.2%,transparent 24.3% 75%,rgba(185,207,219,.08) 75.1% 75.2%,transparent 75.3%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.75),transparent 82%)}.hero .wrap{position:relative;z-index:1}.hero h1,.head h2{font-family:Inter,system-ui,sans-serif;font-weight:850;letter-spacing:-.035em;text-transform:uppercase}.card,.stage,.metric,.node{border-radius:5px!important;background:linear-gradient(180deg,#15212a,#0d151b)!important}.metric{border-top:2px solid var(--project-primary)!important}.node{border-radius:3px!important;position:relative}.node:not(:last-child):after{content:"→";position:absolute;right:-10px;top:50%;color:var(--project-signal);transform:translateY(-50%);font-weight:800}.primary{border-radius:4px!important}.card:hover{transform:translateX(2px);transition:.18s ease;border-color:var(--project-primary)!important}.head{padding-bottom:10px;border-bottom:1px dashed var(--line)}.eyebrow{font-family:'SFMono-Regular',Consolas,monospace}</style>''',
          'AGROHUB.html':'''<style data-etalon03-project-style="AGROHUB">body{background:radial-gradient(circle at 12% 0,rgba(154,182,106,.10),transparent 30%),linear-gradient(180deg,var(--bg),#111a0f 52%,var(--bg))!important}.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(198,220,145,.07) 1px,transparent 1px),linear-gradient(rgba(198,220,145,.07) 1px,transparent 1px);background-size:68px 34px;transform:skewY(-2deg);mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 78%)}.hero .wrap{position:relative;z-index:1}.hero h1,.head h2{font-family:Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-.035em}.card,.stage,.metric,.node{border-radius:13px!important;background:linear-gradient(145deg,#172415,#0d150c)!important}.metric{border-top:0!important;border-left:3px solid var(--project-primary)!important}.node{border-radius:10px!important}.primary{border-radius:9px!important}.card:hover{transform:translateY(-2px) rotate(-.2deg);transition:.22s ease;border-color:var(--project-primary)!important}.visual,.product img{border-radius:10px!important}.head{border-left:3px solid var(--project-primary);padding-left:15px}.eyebrow{letter-spacing:.18em!important}</style>''',
          'ENERGY-PARK.html':'''<style data-etalon03-project-style="ENERGY-PARK">body{background:radial-gradient(circle at 50% 0,rgba(85,214,223,.15),transparent 34%),linear-gradient(180deg,#071013,#0b1b1f 50%,#061013)!important}.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(circle,transparent 0 24%,rgba(140,240,245,.12) 24.2% 24.4%,transparent 24.7% 44%,rgba(85,214,223,.09) 44.2% 44.4%,transparent 44.7%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 72%)}.hero .wrap{position:relative;z-index:1}.hero h1,.head h2{font-family:Inter,system-ui,sans-serif;font-weight:850;letter-spacing:-.05em}.card,.stage,.metric,.node{border-radius:6px!important;background:linear-gradient(145deg,#102329,#081316)!important}.metric{border-top:2px solid var(--project-primary)!important;box-shadow:0 0 22px rgba(85,214,223,.05)}.node{border-radius:50%!important;min-height:78px;display:flex;flex-direction:column;justify-content:center}.primary{border-radius:5px!important;box-shadow:0 0 30px rgba(85,214,223,.16)}.card:hover,.node:hover{transform:translateY(-3px);transition:.2s ease;border-color:var(--project-primary)!important;box-shadow:0 0 26px rgba(85,214,223,.12)}.head{border-bottom:1px solid var(--project-primary);padding-bottom:11px}.eyebrow{font-family:'SFMono-Regular',Consolas,monospace}</style>''',
          'CARPATHIA.html':'''<style data-etalon03-project-style="CARPATHIA">body{background:radial-gradient(circle at 72% 0,rgba(111,167,122,.12),transparent 34%),linear-gradient(180deg,#08100b,#112017 50%,#07100a)!important}.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 70% 30%,transparent 0 18%,rgba(155,199,162,.08) 18.5%,transparent 19%),radial-gradient(ellipse at 30% 70%,transparent 0 24%,rgba(111,167,122,.06) 24.5%,transparent 25%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 80%)}.hero .wrap{position:relative;z-index:1}.hero h1,.head h2{font-family:Georgia,'Times New Roman',serif;font-weight:600;letter-spacing:-.03em}.card,.stage,.metric,.node{border-radius:20px!important;background:linear-gradient(145deg,#142219,#0b140e)!important}.metric{border-top:1px solid var(--project-primary)!important}.node{border-radius:14px!important}.primary{border-radius:12px!important;box-shadow:0 10px 32px rgba(111,167,122,.12)}.card:hover{transform:translateY(-4px);transition:.28s ease;border-color:var(--project-primary)!important;box-shadow:0 14px 35px rgba(0,0,0,.18)}.visual,.product img{border-radius:16px!important}.head{padding-bottom:12px}.eyebrow{letter-spacing:.16em!important}</style>'''
          }
          for name,style in styles.items():
              p=root/name; text=p.read_text(encoding='utf-8')
              marker=f'data-etalon03-project-style="{name.rsplit(".",1)[0]}"'
              if marker not in text:
                  p.write_text(text.replace('</head>',style+'</head>',1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ЭТАЛОН-03/MMW-COMPANY/site/projects/'
          git add '.github/workflows/etalon03-project-styles.yml'
          git commit -m 'ETALON 03: give each project an individual visual language' || exit 0
          git rm '.github/workflows/etalon03-project-styles.yml'
          git rm 'ЭТАЛОН-03/MMW-COMPANY/.github/workflows/etalon03-project-styles.yml' 2>/dev/null || true
          git commit -m 'ETALON 03: remove temporary visual-style workflow'
          git push
