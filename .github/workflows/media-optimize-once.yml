name: MMW-COMPANY controlled media optimization

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05
    paths:
      - ".github/workflows/media-optimize-once.yml"

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 1

      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check --no-input Pillow

      - name: Optimize heavy local JPEG assets
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import os

          root = Path("MMW-COMPANY/2 — WORKING/public/ASSETS")
          threshold = 1_000_000
          max_edge = 2400
          quality = 82

          changed = []
          before_total = 0
          after_total = 0

          for p in sorted(root.rglob("*")):
              if p.suffix.lower() not in {".jpg", ".jpeg"} or not p.is_file():
                  continue

              size_before = p.stat().st_size
              if size_before <= threshold:
                  continue

              before_total += size_before
              tmp = p.with_name(p.name + ".optimized")

              with Image.open(p) as im:
                  im.load()
                  original_size = im.size
                  work = im.convert("RGB")
                  work.thumbnail((max_edge, max_edge), Image.Resampling.LANCZOS)
                  work.save(
                      tmp,
                      format="JPEG",
                      quality=quality,
                      optimize=True,
                      progressive=True,
                      subsampling="4:2:0",
                  )

              size_after = tmp.stat().st_size
              if size_after >= size_before * 0.98:
                  tmp.unlink(missing_ok=True)
                  after_total += size_before
                  continue

              tmp.replace(p)
              changed.append((str(p), size_before, size_after, original_size, Image.open(p).size))
              after_total += size_after

          print("OPTIMIZED FILES:", len(changed))
          for path, before, after, old_dim, new_dim in changed:
              print(f"{path}: {before/1024/1024:.2f} MB -> {after/1024/1024:.2f} MB | {old_dim} -> {new_dim}")

          print(f"HEAVY MEDIA BEFORE: {before_total/1024/1024:.2f} MB")
          print(f"HEAVY MEDIA AFTER:  {after_total/1024/1024:.2f} MB")
          if changed:
              print(f"SAVED: {(before_total-after_total)/1024/1024:.2f} MB")

      - name: Verify optimized assets
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          root = Path("MMW-COMPANY/2 — WORKING/public/ASSETS")
          checked = 0
          failures = []

          for p in root.rglob("*"):
              if p.suffix.lower() not in {".jpg", ".jpeg"} or not p.is_file():
                  continue
              try:
                  with Image.open(p) as im:
                      im.verify()
                  checked += 1
              except Exception as exc:
                  failures.append(f"{p}: {exc}")

          print("VALID JPEG FILES:", checked)
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)

      - name: Commit optimized local assets and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MMW-COMPANY media optimizer"
          git config user.email "itimchenko00@gmail.com"
          git rm -f ".github/workflows/media-optimize-once.yml"
          git add -A "MMW-COMPANY/2 — WORKING/public/ASSETS"
          git status --short
          if git diff --cached --quiet; then
            echo "No optimization changes."
            exit 0
          fi
          git commit -m "Optimize local Factory media payload"
          git push origin HEAD:MMW-COMPANY-WORKSPACE-V1-2026-10-05
