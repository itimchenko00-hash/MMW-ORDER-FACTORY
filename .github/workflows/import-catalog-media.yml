name: Import MMW-COMPANY catalog media

on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.event.head_commit.message != 'MMW-COMPANY: import catalog media' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active workspace
        uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05
          fetch-depth: 1

      - name: Download, validate, zip, and unpack controlled catalog assets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/catalog"
          TMP="$RUNNER_TEMP/mmw-catalog-media"
          ZIP="$RUNNER_TEMP/mmw-catalog-media.zip"
          rm -rf "$TMP" "$ROOT"
          mkdir -p "$TMP" "$ROOT"

          download() {
            local file="$1"
            local url="$2"
            curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 180               -A "Mozilla/5.0 MMW-COMPANY controlled media importer" -o "$TMP/$file" "$url"
            file "$TMP/$file" | grep -Eiq 'JPEG image data' || {
              echo "Invalid JPEG: $file"
              exit 1
            }
          }

          download "01-project-audit.jpg" "https://images.pexels.com/photos/7947657/pexels-photo-7947657.jpeg"
          download "02-project-concept.jpg" "https://images.pexels.com/photos/33175651/pexels-photo-33175651.jpeg"
          download "03-business-project.jpg" "https://images.pexels.com/photos/9034211/pexels-photo-9034211.jpeg"
          download "04-investment-project.jpg" "https://images.pexels.com/photos/20142114/pexels-photo-20142114.jpeg"
          download "05-business-system.jpg" "https://images.pexels.com/photos/6804091/pexels-photo-6804091.jpeg"
          download "06-business-restart.jpg" "https://images.pexels.com/photos/5324903/pexels-photo-5324903.jpeg"
          download "07-business-investor.jpg" "https://images.pexels.com/photos/8439701/pexels-photo-8439701.jpeg"
          download "08-custom-business-project.jpg" "https://images.pexels.com/photos/26966417/pexels-photo-26966417.jpeg"
          download "09-large-scale.jpg" "https://images.pexels.com/photos/33827307/pexels-photo-33827307.jpeg"
          download "10-estimate.jpg" "https://images.pexels.com/photos/11427092/pexels-photo-11427092.jpeg"
          download "11-site-survey.jpg" "https://images.pexels.com/photos/7937329/pexels-photo-7937329.jpeg"
          download "12-docs.jpg" "https://images.pexels.com/photos/10376233/pexels-photo-10376233.jpeg"
          download "13-management.jpg" "https://images.pexels.com/photos/39219853/pexels-photo-39219853.jpeg"
          download "14-urgent.jpg" "https://images.pexels.com/photos/29218404/pexels-photo-29218404.jpeg"
          download "15-aladin-residence.jpg" "https://images.pexels.com/photos/7587880/pexels-photo-7587880.jpeg"
          download "16-carpathia-eco-lodge.jpg" "https://images.pexels.com/photos/33799052/pexels-photo-33799052.jpeg"
          download "17-nexus-work.jpg" "https://images.pexels.com/photos/7854200/pexels-photo-7854200.jpeg"
          download "18-nexus-logistics.jpg" "https://images.pexels.com/photos/29786116/pexels-photo-29786116.jpeg"
          download "19-agrohub.jpg" "https://images.pexels.com/photos/31929097/pexels-photo-31929097.jpeg"
          download "20-energy-park.jpg" "https://images.pexels.com/photos/27873672/pexels-photo-27873672.jpeg"

          (cd "$TMP" && zip -q "$ZIP" *.jpg)
          unzip -q "$ZIP" -d "$ROOT"
          test "$(find "$ROOT" -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 20

      - name: Write provenance
        shell: bash
        run: |
          cat > "MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/catalog/SOURCES.md" <<'EOF'
# MMW-COMPANY catalog media provenance

Controlled import standard:
WEB SOURCE → CONTROLLED IMPORT → LOCAL FACTORY ASSET → SEMANTIC PLACEMENT → PROVENANCE → QA → LIVE

All files in this folder are locally stored project assets. The website does not load these photos from Pexels at runtime.

| Asset | Catalog meaning | Source |
|---|---|---|
| 01-project-audit.jpg | Предпроектный аудит — financial report review | https://www.pexels.com/photo/black-magnifying-glass-on-the-table-7947657/ |
| 02-project-concept.jpg | PROJECT CONCEPT — structured financial/document analysis | https://www.pexels.com/photo/financial-analysis-with-calculator-and-documents-33175651/ |
| 03-business-project.jpg | BUSINESS PROJECT — strategy presentation | https://www.pexels.com/photo/man-doing-a-presentation-beside-a-woman-9034211/ |
| 04-investment-project.jpg | INVESTMENT PROJECT — financial data presentation | https://www.pexels.com/photo/financial-report-data-presentation-expense-and-cost-calculations-20142114/ |
| 05-business-system.jpg | BUSINESS SYSTEM — project workflow | https://www.pexels.com/photo/project-manager-planning-tasks-6804091/ |
| 06-business-restart.jpg | BUSINESS RESTART — business/project discussion | https://www.pexels.com/photo/colleagues-discussing-business-strategy-in-office-5324903/ |
| 07-business-investor.jpg | BUSINESS + INVESTOR — client/advisor consultation | https://www.pexels.com/photo/clients-consulting-an-accountant-8439701/ |
| 08-custom-business-project.jpg | CUSTOM BUSINESS PROJECT — modern coworking environment | https://www.pexels.com/photo/coworking-office-space-with-pc-room-26966417/ |
| 09-large-scale.jpg | LARGE SCALE — large modern office infrastructure | https://www.pexels.com/photo/modern-office-interior-with-workstations-33827307/ |
| 10-estimate.jpg | Расширенная смета — site/technical inspection | https://www.pexels.com/photo/man-working-on-a-construction-site-11427092/ |
| 11-site-survey.jpg | Выезд / обследование объекта — inspection of unfinished property | https://www.pexels.com/photo/woman-in-suit-at-house-in-construction-7937329/ |
| 12-docs.jpg | Дополнительный комплект документов — document organization | https://www.pexels.com/photo/businessman-working-with-documents-and-using-laptop-in-an-office-10376233/ |
| 13-management.jpg | Проектное сопровождение — operations/team environment | https://www.pexels.com/photo/professional-office-environment-with-teamwork-focus-39219853/ |
| 14-urgent.jpg | Срочное оформление — time/deadline | https://www.pexels.com/photo/focus-on-time-in-office-meeting-setting-29218404/ |
| 15-aladin-residence.jpg | ALADIN RESIDENCE — residential concept | https://www.pexels.com/photo/modern-house-exterior-7587880/ |
| 16-carpathia-eco-lodge.jpg | CARPATHIA ECO LODGE — mountain retreat | https://www.pexels.com/photo/mountain-cabin-in-scenic-landscape-33799052/ |
| 17-nexus-work.jpg | NEXUS WORK — coworking/workspace | https://www.pexels.com/photo/minimalistic-contemporary-co-working-space-7854200/ |
| 18-nexus-logistics.jpg | NEXUS LOGISTICS — warehouse and distribution | https://www.pexels.com/photo/warehouse-with-delivery-truck-exiting-the-loading-dock-29786116/ |
| 19-agrohub.jpg | AGROHUB — agriculture | https://www.pexels.com/photo/farmer-in-a-green-agricultural-field-31929097/ |
| 20-energy-park.jpg | ENERGY PARK — solar energy | https://www.pexels.com/photo/solar-panels-27873672/ |

Source pages were checked as free-to-use Pexels photos before import. No AI-generated image was selected.
EOF

      - name: Validate uniqueness and local files
        shell: bash
        run: |
          set -euo pipefail
          ROOT="MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/catalog"
          test "$(find "$ROOT" -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 20
          test "$(find "$ROOT" -maxdepth 1 -type f -name '*.jpg' -printf '%s\n' | sort -u | wc -l)" -eq 20
          file "$ROOT"/*.jpg | grep -vE 'JPEG image data' && exit 1 || true

      - name: Commit local media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MMW-COMPANY media importer"
          git config user.email "actions@users.noreply.github.com"
          git add "MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/catalog"
          if git diff --cached --quiet; then
            echo "No media changes."
            exit 0
          fi
          git commit -m "MMW-COMPANY: import catalog media"
          git push origin MMW-COMPANY-WORKSPACE-V1-2026-10-05
