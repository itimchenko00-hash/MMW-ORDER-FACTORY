name: MMW catalog local media import
on:
  push:
    branches:
      - MMW-COMPANY-WORKSPACE-V1-2026-10-05

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: MMW-COMPANY-WORKSPACE-V1-2026-10-05

      - name: Import local binaries
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -e
          if [ "$COMMIT_MESSAGE" = "MMW-COMPANY: import catalog media" ]; then
            echo "Import commit already completed."
            exit 0
          fi
          root="MMW-COMPANY/2 — WORKING/public/ASSETS/MMW-COMPANY/catalog"
          tmp="$RUNNER_TEMP/catalog"
          rm -rf "$tmp" "$root"
          mkdir -p "$tmp" "$root"
          while read -r file id; do
            url="https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1800"
            curl -fsSL --retry 5 --retry-delay 2 --connect-timeout 30 --max-time 180 -A "Mozilla/5.0 MMW-COMPANY importer" "$url" -o "$tmp/$file"
            python - "$tmp/$file" <<'PY'
import sys
from pathlib import Path
b=Path(sys.argv[1]).read_bytes()
assert len(b)>10000 and b[:3]==b"\xff\xd8\xff", (sys.argv[1],len(b),b[:16])
PY
          done <<'EOF'
01-project-audit.jpg 7947657
02-project-concept.jpg 33175651
03-business-project.jpg 36733299
04-investment-project.jpg 6779226
05-business-system.jpg 6804091
06-business-restart.jpg 6340632
07-business-investor.jpg 7698804
08-custom-business-project.jpg 8970671
09-large-scale.jpg 36765714
10-estimate.jpg 5506079
11-site-survey.jpg 7937681
12-docs.jpg 8112204
13-management.jpg 36766701
14-urgent.jpg 7887814
15-aladin-residence.jpg 38210395
16-carpathia-eco-lodge.jpg 33799052
17-nexus-work.jpg 7854200
18-nexus-logistics.jpg 221047
19-agrohub.jpg 9792176
20-energy-park.jpg 7527908
EOF
          cp "$tmp"/*.jpg "$root"/
          cat > "$root/SOURCES.md" <<'EOF'
# MMW-COMPANY catalog media provenance
Controlled import: WEB SOURCE → CONTROLLED IMPORT → LOCAL FACTORY ASSET → SEMANTIC PLACEMENT → PROVENANCE → QA → LIVE

All 20 catalog photos are committed local binary assets; no catalog photo is fetched at runtime.
EOF
          test "$(find "$root" -maxdepth 1 -name '*.jpg' -type f | wc -l)" -eq 20
          git config user.name "MMW-COMPANY media importer"
          git config user.email "actions@users.noreply.github.com"
          git add "$root"
          git commit -m "MMW-COMPANY: import catalog media"
          git push origin MMW-COMPANY-WORKSPACE-V1-2026-10-05
