<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172d35"><title>Администрирование — ЕДИНСТВО</title><style>
:root{--ink:#172d35;--sea:#286b70;--paper:#f2ead7;--gold:#c6a66b;--muted:#647579;--line:rgba(23,45,53,.18)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.top{height:5px;background:linear-gradient(90deg,var(--sea),var(--gold),#9fc9c2)}main{width:min(1100px,calc(100% - 32px));margin:32px auto}.brand{font-weight:800;letter-spacing:.16em;color:var(--sea);text-decoration:none;font-size:12px}h1{font:500 clamp(32px,5vw,48px)/1.1 Georgia,serif}.panel{padding:20px;background:#fffaf0;border:1px solid var(--line);margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--ink);border-radius:7px;padding:10px 13px;background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer}.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}.notice{white-space:pre-wrap;background:#f5efdf;border-left:3px solid var(--gold);padding:12px;margin:12px 0}.list{display:grid;gap:12px}.item{border:1px solid var(--line);padding:16px;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:13px}label{display:grid;gap:5px;margin:10px 0;font-weight:650;font-size:13px}input,textarea,select{font:inherit;padding:10px;border:1px solid #bdc7c4;border-radius:7px;background:white;color:var(--ink);width:100%}textarea{min-height:70px}.hidden{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button[aria-pressed=true]{background:var(--sea);border-color:var(--sea)}.item h3{margin:0 0 5px;font-size:18px}
</style></head><body><div class="top"></div><main><a class="brand" href="./index.html">← ЕДИНСТВО</a><h1>Административная панель</h1><p class="muted">Закрытая зона. Действия доступны только пользователям с серверной ролью администратора.</p><div id="notice" class="notice" role="status" aria-live="polite">Проверяем сессию…</div><section id="dashboard" class="hidden"><div class="panel"><div class="row"><strong id="identity"></strong><button id="refresh" class="btn alt">Обновить очереди</button><button id="logout" class="btn alt">Выйти</button></div></div><div class="panel"><div class="tabs"><button class="btn" data-view="pending" aria-pressed="true">Заявки</button><button class="btn alt" data-view="reports" aria-pressed="false">Жалобы</button></div><div id="list" class="list" style="margin-top:16px"></div></div></section><script type="module" src="./admin.js"></script></main></body></html>
