<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>NEXUS WORK — Integrated Space System</title></head><body><script>const old='https://raw.githubusercontent.com/itimchenko00-hash/MMW-ORDER-FACTORY/1ec204e3f6a4e1489c6b3e382c1a219e8a1a49cc/ЭТАЛОН-02/MMW-COMPANY/projects/NEXUS-WORK/website/nexus-work-presentation-suite.html';fetch(old).then(r=>r.text()).then(html=>{const p=new DOMParser().parseFromString(html,'text/html');const oldSpace=p.querySelector('#space');const oldEnv=p.querySelector('#environment');if(!oldSpace)throw Error('SPACE section not found');const css=`.nx-system{display:grid;grid-template-columns:310px 1fr;gap:14px;padding:35px 0 85px}.nx-controls,.nx-panel2{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--p2),var(--p));padding:20px}.nx-controls{height:max-content;position:sticky;top:88px}.nx-controls h3{margin-top:0;color:var(--a2)}.nx-tabs2{display:grid;gap:8px}.nx-tab2{text-align:left}.nx-tab2 small{display:block;color:var(--m);font-weight:500;margin-top:3px}.nx-panel2{min-height:610px}.nx-panelhead{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px}.nx-panelhead h2{font:800 clamp(35px,5vw,58px)/.95 Georgia,serif;margin:7px 0}.nx-panelhead p{color:var(--m);max-width:510px}.nx-visual{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.nx-herocard{min-height:330px;border-radius:17px;background:center/cover;position:relative;overflow:hidden;border:1px solid var(--line)}.nx-herocard:after{content:\"\";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,#061018e8)}.nx-herotext{position:absolute;z-index:1;left:22px;right:22px;bottom:20px}.nx-herotext b{font:800 31px Georgia,serif;color:var(--a2)}.nx-herotext span{display:block;color:#d0dde0;margin-top:6px}.nx-info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.nx-infocard{padding:18px;border:1px solid var(--line);border-ra ия.'],['KPI','Загрузка слотов · частота бронирований · средняя сессия']]},community:{ey:'04 / COMMUNITY',title:'Сеть, которая усиливает продукт.',desc:'COMMUNITY превращает соседство резидентов в дополнительную ценность: события, обучение, знакомства и потенциальные партнёрства.',img:'https://images.unsplash.com/photo-1515169067868-5387ec356754?auto=format&fit=crop&w=1500&q=85',label:'COMMUNITY',text:'Участник приходит за пространством, а остаётся ради экосистемы связей.',info:[['EVENTS','События','Точки регулярного взаимодействия.'],['NETWORK','Связи','Контакты между резидентами и партнёрами.'],['LEARNING','Обучение','Обмен знаниями и компетенциями.'],['RETENTION','Удержание','Социальная ценность дополняет физический продукт.']],flow:[['01','СОБЫТИЕ'],['02','КОНТАКТ'],['03','КОЛЛАБОРАЦИЯ'],['04','УДЕРЖАНИЕ']],matrix:[['FUNCTION','Формировать профессиональную сеть.'],['VALUE','Создавать дополнительную полезность для резидента.'],['KPI','Активность · участие · повторные взаимодействия']]},service:{ey:'05 / SERVICE',title:'Оператор как слой качества.',desc:'',img:'https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1500&q=85',label:'SERVICE',text:'Пространство становится услугой только тогда, когда его состояние и обслуживание управляются.',info:[['OPERATIONS','Операции','Ежедневная готовность инфраструктуры.'],['SUPPORT','Поддержка','Решение задач резидента.'],['QUALITY','Качество','Единый стандарт клиентского опыта.'],['CONTROL','Контроль','Показатели и регламенты оператора.']],flow:[['01','РЕСУРС'],['02','ОПЕРАЦИЯ'],['03','КАЧЕСТВО'],['04','ОПЫТ']],matrix:[['FUNCTION','Обеспечить стабильную работу среды.'],['VALUE','Уменьшить операционную нагрузку на резидента.'],['KPI','SLA · обращения · качество сервиса']]},digital:{ey:'06 / DIGITAL',title:'Данные связывают систему.',desc:'DIGITAL — это не отдельный продукт, а управляющий слой: доступ, бронирование, события, сервисы и показатели собираются в единую логику.',img:'https://images.unsplas v>').join('')+'</div>';box.querySelectorAll('.nx-tab2').forEach(b=>b.classList.toggle('primary',b.dataset.key===k))}box.querySelectorAll('.nx-tab2').forEach(b=>b.addEventListener('click',()=>render(b.dataset.key)));render('space');oldSpace.replaceWith(box);if(oldEnv)oldEnv.remove();p.querySelectorAll('style,link').forEach(x=>{});document.open();document.write('<!doctype html>'+p.documentElement.outerHTML);document.close()}).catch(e=>{document.body.innerHTML='<p style="font-family:system-ui;padding:30px">NEXUS WORK: '+e.message+'</p>'})</script></body></html>
