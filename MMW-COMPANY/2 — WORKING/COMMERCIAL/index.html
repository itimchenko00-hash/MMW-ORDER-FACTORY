<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMW-COMPANY — заявка</title><style>:root{--i:#061a17;--e:#0f9477;--m:#a8e4d1;--p:#f3f5ef;--line:#dce7e2}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:15px/1.5 Inter,system-ui,sans-serif}.wrap{width:min(980px,calc(100% - 32px));margin:auto}.hero{padding:60px 0 30px}.ey{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--e)}h1{font-size:clamp(42px,7vw,76px);line-height:.92;letter-spacing:-.06em;margin:14px 0}p{color:#5b6d66}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:25px;margin:18px 0}h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{border:1px solid var(--line);border-radius:16px;padding:15px}.item button,button{border:0;border-radius:12px;padding:11px 14px;background:var(--i);color:#fff;font:inherit;cursor:pointer}.price{font-weight:900;font-size:19px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-top:5px}form{display:grid;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px;border-radius:12px;background:#e6f5ee}.error{background:#faeaea;color:#9b4d4d}.code{font-size:25px;font-weight:900;letter-spacing:.12em}.muted{font-size:12px;color:#71817b}@media(max-width:650px){.grid,.two{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><div class="ey">MMW-COMPANY · ТЕХНИЧЕСКИЙ КОММЕРЧЕСКИЙ КОНТУР</div><h1>Оформление заявки.</h1><p>Здесь формируется коммерческая заявка MMW-COMPANY. Публичный сайт передаёт только контекст проекта; персональные данные и заказ обрабатываются в этом контуре.</p></section><section class="panel"><h2>Каталог</h2><div id="catalog" class="grid"></div></section><section class="panel"><h2>Ваша заявка</h2><div id="cart"></div><div class="row"><strong>Итого</strong><strong id="total">0 UAH</strong></div></section><section class="panel"><h2>Данные клиента</h2><form id="form"><div class="two"><label>Имя<input name="name" required></label><label>Телефон<input name="phone" placeholder="+380…" required></label></div><div class="two"><label>Email<input type="email" name="email" required></label><label>Проект<input name="project" id="project"></label></div><label>Комментарий<textarea name="comment"></textarea></label><div id="notice"></div><button>Создать заявку</button></form></section></main><script>
const state={items:[],cart:new Map()},money=n=>new Intl.NumberFormat("uk-UA",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+" UAH",esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));async function api(u,o){const r=await fetch(u,o),d=await r.json().catch(()=>({error:"server_error"}));if(!r.ok)throw Error(d.error||"request_failed");return d}function render(){document.getElementById("catalog").innerHTML=state.items.length?state.items.map(x=>'<div class="item"><div class="muted">'+esc(x.kind)+(x.project?" · "+esc(x.project):"")+'</div><strong>'+esc(x.name)+'</strong><p>'+esc(x.description)+'</p><div class="price">'+money(x.price_uah)+'</div><button onclick="add('+JSON.stringify(x.id)+')">Добавить</button></div>').join(""):'<p class="muted">Каталог пока не заполнен.</p>';const a=[...state.cart.entries()];let t=0;document.getElementById("cart").innerHTML=a.length?a.map(([id,q])=>{const x=state.items.find(z=>z.id===id),v=x.price_uah*q;t+=v;return '<div class="row"><span>'+esc(x.name)+' × '+q+'</span><span>'+money(v)+'</span></div>'}).join(""):'<p class="muted">Добавьте позицию из каталога.</p>';document.getElementById("total").textContent=money(t)}function add(id){state.cart.set(id,(state.cart.get(id)||0)+1);render()}async function init(){const q=new URLSearchParams(location.search).get("project");if(q)document.getElementById("project").value=q;const d=await api("/api/catalog");state.items=d.items||[];render()}document.getElementById("form").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),items=[...state.cart].map(([id,quantity])=>({id,quantity}));if(!items.length)return document.getElementById("notice").innerHTML='<div class="notice error">Добавьте позицию из каталога.</div>';try{const d=await api("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.get("name"),phone:f.get("phone"),email:f.get("email"),project:f.get("project"),comment:f.get("comment"),items})});document.getElementById("notice").innerHTML='<div class="notice">Заявка принята.<br>Номер: <strong>'+d.order.order_number+'</strong><br>Код доступа: <span class="code">'+d.order.access_code+'</span><br><span class="muted">Сохраните эти данные для журнала.</span></div>';state.cart.clear();render()}catch(x){document.getElementById("notice").innerHTML='<div class="notice error">'+esc(x.message)+'</div>'}};init().catch(x=>document.getElementById("catalog").innerHTML='<p class="muted">'+esc(x.message)+'</p>');</script></body></html>
