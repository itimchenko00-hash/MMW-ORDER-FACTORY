name: ETALON 03 visual palette normalization
on:
  push:
    paths:
      - '.github/workflows/visual-fix.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize remaining project pages
        shell: python
        run: |
          from pathlib import Path
          import re
          pages = {
            'ALADIN.html': {
              'primary':'#d9b98a','secondary':'#5a4934','soft':'#272116','signal':'#f0d3a4','bg':'#11100d','panel':'#1c1812','line':'#5a4934'
            },
            'ENERGY-PARK.html': {
              'primary':'#55d6df','secondary':'#27535a','soft':'#11282d','signal':'#8cf0f5','bg':'#071013','panel':'#0d1c20','line':'#27535a'
            },
            'CARPATHIA.html': {
              'primary':'#6fa77a','secondary':'#3d5944','soft':'#17281c','signal':'#9bc7a2','bg':'#08100b','panel':'#101c14','line':'#3d5944'
            },
          }
          root = Path('ЭТАЛОН-03/MMW-COMPANY/site/projects')
          for name, c in pages.items():
            p = root / name
            s = p.read_text(encoding='utf-8')
            style = f'''<style data-etalon03-final-palette="{name}">
:root{{--bg:{c['bg']};--panel:{c['panel']};--line:{c['line']};--text:#f4f7f3;--muted:#9eaea8;--accent:{c['primary']};--gold:{c['primary']};--gold2:{c['signal']};--project-primary:{c['primary']};--project-secondary:{c['secondary']};--project-soft:{c['soft']};--project-signal:{c['signal']}}}
html,body{{background:var(--bg)!important;color:var(--text)!important}}
body{{background:linear-gradient(180deg,var(--bg),var(--panel),var(--bg))!important}}
nav,.nav{{background:color-mix(in srgb,var(--bg) 94%,transparent)!important;border-color:var(--line)!important}}
.btn{{background:var(--panel)!important;border-color:var(--line)!important}}
.primary{{background:linear-gradient(135deg,var(--project-signal),var(--project-primary))!important;color:#08100b!important;border-color:var(--project-primary)!important}}
.hero{{background-color:var(--bg)!important}}
.s,.section,section{{border-color:var(--line)!important}}
.card,.stage,.metric,.node{{background:linear-gradient(145deg,var(--panel),var(--bg))!important;border-color:var(--line)!important}}
.metric{{border-top-color:var(--project-primary)!important}}
.card b,.node b,.metric strong,.stage strong,.price,.kicker,.eyebrow{{color:var(--project-signal)!important}}
.node:hover,.node.active{{border-color:var(--project-primary)!important;background:var(--project-soft)!important}}
.cta{{border-color:var(--project-primary)!important}}
footer,.footer{{border-color:var(--line)!important;color:var(--muted)!important}}
</style>'''
            s = re.sub(r'</head>', style + '</head>', s, count=1, flags=re.I)
            p.write_text(s, encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ЭТАЛОН-03/MMW-COMPANY/site/projects/ALADIN.html' 'ЭТАЛОН-03/MMW-COMPANY/site/projects/ENERGY-PARK.html' 'ЭТАЛОН-03/MMW-COMPANY/site/projects/CARPATHIA.html'
          git rm -f 'ЭТАЛОН-03/MMW-COMPANY/.github/workflows/visual-fix.yml'
          git commit -m 'ETALON 03: finish project page palette system' || exit 0
          git push